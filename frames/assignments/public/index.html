<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignments</title>
  <link rel="stylesheet" href="dyn/frame-prefs.css">
  <style>
    :root { --ch: var(--os-c1); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    /* the render root carries the height too, or `main { height: 100% }` resolves
       against an auto-height div and the frame stops driving its own layout */
    html, body, #app { height: 100%; }
    body {
      margin: 0; font-family: var(--os-font-sans); background: var(--os-bg);
      color: var(--os-text); font-size: var(--os-fs-base);
    }
    main {
      height: 100%; max-width: 760px; margin: 0 auto;
      display: flex; flex-direction: column; gap: var(--os-sp-md);
      padding: clamp(var(--os-sp-md), 3vw, var(--os-sp-xl));
    }

    .header { display: flex; align-items: center; gap: var(--os-sp-sm); flex: 0 0 auto; }
    .header > i {
      flex: 0 0 auto; width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 20px; line-height: 1; color: var(--ch);
    }
    .header h1 {
      flex: 1 1 auto; min-width: 0; margin: 0;
      font-size: var(--os-fs-lg); font-weight: var(--os-weight-semibold); line-height: 24px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header .mode {
      flex: 0 0 auto; height: 24px; display: inline-flex; align-items: center;
      font-size: var(--os-fs-2xs); color: var(--os-text-muted); white-space: nowrap;
    }
    .iconbtn {
      flex: 0 0 auto; width: 24px; height: 24px; padding: 0;
      background: none; border: 0; border-radius: var(--os-radius-sm); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--os-text-subtle); font-size: 16px; line-height: 1;
      transition: color 150ms, background 150ms;
    }
    .iconbtn i { font-size: 16px; line-height: 1; color: inherit; width: auto; height: auto; }
    .iconbtn:hover { color: var(--os-text); background: var(--os-bg-subtle); }
    .iconbtn:active { transform: scale(0.92); }
    .iconbtn:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }

    .banner {
      display: flex; align-items: center; gap: var(--os-sp-xs);
      background: var(--os-bg-inset); border-radius: var(--os-radius-md);
      padding: var(--os-sp-sm) var(--os-sp-md); font-size: var(--os-fs-sm);
      color: var(--os-text-secondary); flex: 0 0 auto;
    }

    /* the frame's ONE editorial line (PRECISION §2) — it answers the question the student
       opened the frame to ask, so nothing below has to be counted */
    .verdict {
      flex: 0 0 auto; margin: var(--os-sp-xs) 0 0;
      font-family: var(--os-font-serif); font-size: clamp(19px, 4.2vw, 25px);
      font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; color: var(--os-text);
    }
    .verdict em { font-style: italic; color: var(--ch); }
    .verdict em.late { color: var(--os-cError); }

    .tabrow { display: flex; align-items: center; gap: var(--os-sp-md); flex: 0 0 auto; }
    .seg { display: flex; flex: 0 0 auto; border: 1px solid var(--os-border-color); border-radius: var(--os-radius-md); overflow: hidden; }
    .seg button {
      border-radius: 0; background: var(--os-bg); border: 0; cursor: pointer;
      padding: var(--os-sp-sm) var(--os-sp-md); font: inherit; font-size: var(--os-fs-sm);
      color: var(--os-text-secondary); transition: background 150ms, color 150ms;
    }
    .seg button + button { border-left: 1px solid var(--os-border-color); }
    .seg button:hover:not(.active) { background: var(--os-bg-subtle); }
    .seg button.active { background: var(--ch); color: var(--ch-fg, var(--os-c1-fg)); font-weight: var(--os-weight-medium); }
    .tabrow .sp { flex: 1 1 auto; }
    .gpa {
      flex: 0 0 auto; display: flex; align-items: baseline; gap: var(--os-sp-xs);
      font-size: var(--os-fs-2xs); color: var(--os-text-muted);
    }
    .gpa b {
      font-size: var(--os-fs-lg); font-weight: var(--os-weight-semibold);
      letter-spacing: -0.02em; color: var(--os-text); font-feature-settings: 'tnum' 1;
    }

    .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-bottom: var(--os-sp-sm); }
    .group {
      font-size: 11px; font-weight: var(--os-weight-semibold); text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--os-text-muted); margin: var(--os-sp-lg) 0 var(--os-sp-xs);
    }
    .scroll > .group:first-child { margin-top: 0; }
    .group.late { color: var(--os-cError); }

    /* ---- a piece of work ------------------------------------------------------------- */
    .w {
      display: flex; align-items: center; gap: var(--os-sp-md); min-width: 0;
      padding: var(--os-sp-sm) var(--os-sp-xs); border-radius: var(--os-radius-sm);
      transition: background 150ms;
      overflow: hidden;
    }
    .w + .w { border-top: 1px solid var(--os-border-color-subtle); }
    .w:hover { background: var(--os-bg-subtle); }
    /* THE ONE FUN MOMENT: finished work doesn't just grey out, it lifts out of the list —
       the row collapses to nothing and takes its own space with it. Clearing work should
       feel like clearing work. */
    .w.clearing { animation: lift-out 300ms var(--os-ease-out) forwards; pointer-events: none; }
    @keyframes lift-out {
      0%   { opacity: 1; transform: translateX(0); max-height: 60px; }
      45%  { opacity: 0; transform: translateX(14px); max-height: 60px; }
      100% { opacity: 0; transform: translateX(14px); max-height: 0; padding-top: 0; padding-bottom: 0; border-top-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .w.clearing { animation: none; opacity: 0.4; } }

    .tick {
      flex: 0 0 26px; width: 26px; height: 26px; padding: 0; cursor: pointer;
      border-radius: var(--os-radius-full); background: none;
      border: 2px solid var(--os-border-color);
      display: inline-flex; align-items: center; justify-content: center;
      color: transparent; font-size: 14px; line-height: 1;
      transition: background 150ms, border-color 150ms, color 150ms, transform 80ms var(--os-ease-spring);
    }
    .tick i { font-size: 14px; line-height: 1; }
    main:not(.read-only) .tick:hover { border-color: var(--ch); }
    .tick:active { transform: scale(0.9); }
    .tick:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }
    .w.done .tick { background: var(--ch); border-color: var(--ch); color: var(--ch-fg, var(--os-c1-fg)); }
    .read-only .tick { cursor: default; }

    .w-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .w-title {
      background: none; border: 0; padding: 0; font: inherit; text-align: left; cursor: pointer;
      font-size: var(--os-fs-sm); color: var(--os-text); overflow-wrap: anywhere;
    }
    .w-title:hover { text-decoration: underline; text-underline-offset: 2px; }
    .w-title:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }
    .w.done .w-title { color: var(--os-text-muted); }
    .read-only .w-title { cursor: default; }
    .w-sub { display: flex; align-items: center; gap: var(--os-sp-sm); flex-wrap: wrap; min-width: 0; }
    .course {
      font-size: var(--os-fs-2xs); white-space: nowrap; border-radius: var(--os-radius-full);
      padding: 1px var(--os-sp-sm);
      background: color-mix(in srgb, var(--cc), transparent 86%);
      color: color-mix(in srgb, var(--cc), var(--os-text) 30%);
    }
    .meta { font-size: var(--os-fs-2xs); color: var(--os-text-muted); font-feature-settings: 'tnum' 1; white-space: nowrap; }
    .meta.late { color: var(--os-cError); }
    .score {
      flex: 0 0 auto; font-size: var(--os-fs-sm); font-feature-settings: 'tnum' 1;
      color: var(--os-text-secondary); white-space: nowrap;
    }
    .score b { color: var(--os-text); font-weight: var(--os-weight-medium); }

    /* ---- size as visual mass ----------------------------------------------------------
       The opinion of this frame: a huge thing due Monday matters more than a tiny thing
       due tomorrow. Size is not a label to read, it is how much room the row takes — the
       list is scannable by weight before a single word is read. Three tiers only. */
    .w.s1 { padding-top: 5px; padding-bottom: 5px; }
    .w.s3 { padding-top: var(--os-sp-md); padding-bottom: var(--os-sp-md); }
    .w.s1 .w-title { font-size: var(--os-fs-sm); }
    .w.s2 .w-title { font-size: var(--os-fs-md); }
    .w.s3 .w-title { font-size: var(--os-fs-lg); font-weight: var(--os-weight-medium); letter-spacing: -0.01em; }
    /* the target scales too, so the row's mass reads from the left edge alone */
    .w.s1 .tick { flex-basis: 20px; width: 20px; height: 20px; font-size: 11px; }
    .w.s3 .tick { flex-basis: 32px; width: 32px; height: 32px; font-size: 17px; }
    .w.s1 .tick i { font-size: 11px; }
    .w.s3 .tick i { font-size: 17px; }
    .sz {
      font-size: var(--os-fs-2xs); color: var(--os-text-muted); white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .w.s3 .sz { color: var(--os-text-secondary); font-weight: var(--os-weight-medium); }

    /* the one thing to start next, called out by name */
    .w.lead { background: color-mix(in srgb, var(--ch), transparent 93%); }
    .w.lead:hover { background: color-mix(in srgb, var(--ch), transparent 88%); }

    /* ---- date picker -------------------------------------------------------------------
       A real calendar rather than a formatted text field. It is a centred sheet, not an
       anchored popover, because the list scrolls inside `overflow-y: auto` and an absolute
       popover would be clipped by its own container. */
    .dp-trigger {
      background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
      font-size: var(--os-fs-2xs); color: var(--os-text-muted);
      font-feature-settings: 'tnum' 1; white-space: nowrap;
      border-bottom: 1px dashed var(--os-border-color); line-height: 1.4;
    }
    .dp-trigger:hover { color: var(--os-text); border-bottom-color: var(--os-text-subtle); }
    .dp-trigger:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: 2px; }
    .dp-trigger.late { color: var(--os-cError); border-bottom-color: color-mix(in srgb, var(--os-cError), transparent 60%); }

    .scrim {
      position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.18);
      display: flex; align-items: center; justify-content: center; padding: var(--os-sp-md);
      animation: scrim-in 120ms ease-out;
    }
    @keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
    .dp {
      width: min(290px, 100%); background: var(--os-bg-surface);
      border: 1px solid var(--os-border-color); border-radius: var(--os-radius-lg);
      box-shadow: var(--os-shadow-lg); padding: var(--os-sp-md);
      display: flex; flex-direction: column; gap: var(--os-sp-sm);
      animation: dp-in 160ms var(--os-ease-spring);
    }
    @keyframes dp-in { from { opacity: 0; transform: scale(0.97) translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .scrim, .dp { animation: none; } }
    .dp-head { display: flex; align-items: center; gap: var(--os-sp-xs); }
    .dp-head .m {
      flex: 1 1 auto; text-align: center; font-size: var(--os-fs-sm);
      font-weight: var(--os-weight-medium); font-feature-settings: 'tnum' 1;
    }
    .dp-nav {
      flex: 0 0 auto; width: 26px; height: 26px; padding: 0; cursor: pointer;
      background: none; border: 0; border-radius: var(--os-radius-sm);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--os-text-subtle); font-size: 15px; line-height: 1;
      transition: color 150ms, background 150ms;
    }
    .dp-nav i { font-size: 15px; line-height: 1; color: inherit; }
    .dp-nav:hover { color: var(--os-text); background: var(--os-bg-subtle); }
    .dp-nav:active { transform: scale(0.92); }
    .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .dp-wd {
      text-align: center; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--os-text-muted); padding-bottom: 2px;
    }
    .dp-day {
      aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: var(--os-radius-sm);
      background: none; cursor: pointer; font: inherit; font-size: var(--os-fs-sm);
      color: var(--os-text); font-feature-settings: 'tnum' 1;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background 120ms, color 120ms;
    }
    .dp-day.out { color: var(--os-text-subtle); }
    .dp-day:hover { background: var(--os-bg-subtle); }
    .dp-day.today { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ch), transparent 55%); }
    .dp-day.sel { background: var(--ch); color: var(--ch-fg, var(--os-c1-fg)); }
    .dp-day:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }
    .dp-quick { display: flex; flex-wrap: wrap; gap: var(--os-sp-xs); padding-top: 2px; }
    .dp-quick button {
      flex: 0 0 auto; background: var(--os-bg-inset); border: 0; border-radius: var(--os-radius-full);
      padding: 3px var(--os-sp-sm); cursor: pointer; font: inherit; font-size: var(--os-fs-2xs);
      color: var(--os-text-secondary); transition: background 150ms, color 150ms;
    }
    .dp-quick button:hover { background: var(--os-bg-subtle); color: var(--os-text); box-shadow: inset 0 0 0 1px var(--os-border-color-subtle); }
    .dp-quick button:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }
    .dp-quick .clear { margin-left: auto; color: var(--os-text-muted); background: none; }

    /* the size cycle in the add strip: a 3-position switch, same idiom as the chore
       chart's rhythm — three values is where cycling beats a menu */
    .szbtn {
      flex: 0 0 auto; border: 0; border-left: 1px solid var(--os-border-color-subtle);
      background: none; cursor: pointer; font: inherit; font-size: var(--os-fs-sm);
      color: var(--os-text-muted); padding: 6px var(--os-sp-md); white-space: nowrap;
      transition: color 150ms;
    }
    .szbtn:hover { color: var(--os-text); }
    .szbtn:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }

    /* ---- grades view ------------------------------------------------------------------ */
    .cards { display: flex; flex-direction: column; gap: var(--os-sp-sm); }
    .cc {
      display: flex; align-items: center; gap: var(--os-sp-lg); min-width: 0;
      background: var(--os-bg-surface); border: 1px solid var(--os-border-color-subtle);
      border-radius: var(--os-radius-md); padding: var(--os-sp-md) var(--os-sp-lg);
    }
    .cc .fig { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; min-width: 74px; }
    .cc .fig .n {
      font-size: clamp(26px, 5.4vw, 36px); font-weight: var(--os-weight-semibold);
      letter-spacing: -0.02em; line-height: 1; color: var(--os-text); font-feature-settings: 'tnum' 1;
    }
    .cc .fig .n.none { color: var(--os-text-subtle); }
    .cc .fig .unit { font-size: var(--os-fs-2xs); color: var(--os-text-muted); margin-top: 2px; }
    .cc-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--os-sp-xs); }
    .cc-name {
      background: none; border: 0; padding: 0; font: inherit; text-align: left; cursor: pointer;
      font-size: var(--os-fs-md); font-weight: var(--os-weight-medium); color: var(--os-text);
      overflow-wrap: anywhere;
    }
    .cc-name:hover { text-decoration: underline; text-underline-offset: 3px; }
    .cc-name:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }
    .read-only .cc-name { cursor: default; }
    /* how much of the course has actually been marked — the honest caveat on the figure */
    .bar { height: 4px; border-radius: var(--os-radius-full); background: var(--os-bg-inset); overflow: hidden; display: flex; }
    .bar .g { background: var(--cc-col, var(--ch)); }
    .bar .a { background: color-mix(in srgb, var(--cc-col, var(--ch)), transparent 72%); }
    .cc-meta { font-size: var(--os-fs-2xs); color: var(--os-text-muted); font-feature-settings: 'tnum' 1; }

    .add {
      display: flex; align-items: center; flex: 0 0 auto; width: 100%; max-width: 560px;
      background: var(--os-bg-inset); border: 0; border-radius: var(--os-radius-md);
      padding: 2px var(--os-sp-xs); transition: background 150ms, box-shadow 150ms;
    }
    .add:focus-within { background: var(--os-bg-surface); box-shadow: inset 0 0 0 1px var(--os-border-color); }
    .add > i { color: var(--os-text-subtle); font-size: 14px; line-height: 0; flex: 0 0 auto; margin: 0 var(--os-sp-xs); }
    .add input, .add select {
      display: block; border: 0; background: transparent; box-shadow: none; font: inherit;
      font-size: var(--os-fs-sm); color: var(--os-text); padding: 6px var(--os-sp-sm); min-width: 0;
    }
    .add input:focus, .add select:focus { outline: none; background: transparent; box-shadow: none; }
    .add input.f-title { flex: 1 1 0; width: auto; }
    .add select.f-course { flex: 0 1 120px; border-left: 1px solid var(--os-border-color-subtle); cursor: pointer; }
    .add input.f-due { flex: 0 0 130px; border-left: 1px solid var(--os-border-color-subtle); font-feature-settings: 'tnum' 1; }
    .read-only .add { display: none; }

    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--os-sp-sm); text-align: center; color: var(--os-text-muted); font-size: var(--os-fs-sm);
      padding: var(--os-sp-xl);
    }
    .empty i { font-size: 28px; color: var(--os-text-subtle); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { frame, html, render, useState, useEffect, useRef, useFramePush, applyChannel } from "./lib/js/framelib.js";

    function channelFor(name) {
      let h = 0;
      for (const c of String(name)) h = (h * 31 + c.codePointAt(0)) >>> 0;
      return "var(--os-c" + (h % 12 + 1) + ")";
    }
    // Days between two yyyy-mm-dd strings, parsed at midday so no DST shift can move the
    // answer by one — the same rule the habit tracker uses.
    const at = (s) => new Date(s + "T12:00:00").getTime();
    const daysBetween = (from, to) => Math.round((at(to) - at(from)) / 86400000);
    function dueLabel(due, today) {
      if (!due) return "no date";
      const d = daysBetween(today, due);
      if (d === 0) return "today";
      if (d === 1) return "tomorrow";
      if (d === -1) return "1 day late";
      if (d < 0) return (-d) + " days late";
      if (d < 7) return "in " + d + " days";
      const dt = new Date(at(due));
      return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    // The opinion, in one table. Lead time is how many days before it is due you would
    // want to have STARTED — a huge thing needs a week of runway, a tiny thing needs the
    // evening. Everything below falls out of this.
    const SIZES = [
      { v: 1, label: "tiny",   lead: 1 },
      { v: 2, label: "doable", lead: 3 },
      { v: 3, label: "huge",   lead: 7 },
    ];
    const sizeOf = (v) => SIZES.find((s) => s.v === v) || SIZES[1];

    /** Days of slack before you SHOULD have started. Negative means you are already late
     * to begin — which is the whole point: a huge thing due in 5 days (slack -2) outranks
     * a tiny thing due tomorrow (slack 0). Undated work never claims urgency. */
    function slackOf(w, today) {
      if (!w.due) return Infinity;
      return daysBetween(today, w.due) - sizeOf(w.size).lead;
    }

    const shiftDay = (iso, n) => {
      const d = new Date(iso + "T12:00:00");
      d.setDate(d.getDate() + n);
      const p = (x) => String(x).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    };
    const monthOf = (iso) => iso.slice(0, 7);
    function monthGrid(ym) {
      // Six Mon-Sun rows covering the month, built from calendar fields only.
      const [y, m] = ym.split("-").map(Number);
      const first = new Date(y, m - 1, 1);
      const offset = (first.getDay() + 6) % 7;           // Monday = 0
      const start = new Date(y, m - 1, 1 - offset);
      const out = [];
      const p = (x) => String(x).padStart(2, "0");
      for (let i = 0; i < 42; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        out.push({
          iso: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`,
          day: d.getDate(),
          out: d.getMonth() !== m - 1,
        });
      }
      return out;
    }
    const monthLabel = (ym) =>
      new Date(ym + "-01T12:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" });

    /** A real calendar, as a centred sheet. An anchored popover would be clipped by the
     * scrolling list it opens from. */
    function DateSheet({ value, today, onPick, onClose }) {
      const [ym, setYm] = useState(monthOf(value || today));
      const days = monthGrid(ym);
      const step = (n) => {
        const [y, m] = ym.split("-").map(Number);
        const d = new Date(y, m - 1 + n, 1);
        setYm(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
      };
      return html`
        <div class="scrim" onClick=${onClose}>
          <div class="dp" onClick=${(e) => e.stopPropagation()}>
            <div class="dp-head">
              <button class="dp-nav" title="Previous month" onClick=${() => step(-1)}>
                <i class="ph-light ph-caret-left"></i></button>
              <span class="m">${monthLabel(ym)}</span>
              <button class="dp-nav" title="Next month" onClick=${() => step(1)}>
                <i class="ph-light ph-caret-right"></i></button>
            </div>
            <div class="dp-grid">
              ${["m", "t", "w", "t", "f", "s", "s"].map((d, i) => html`<div class="dp-wd" key=${i}>${d}</div>`)}
              ${days.map((d) => html`
                <button key=${d.iso} type="button"
                  class=${"dp-day" + (d.out ? " out" : "") + (d.iso === today ? " today" : "") + (d.iso === value ? " sel" : "")}
                  onClick=${() => onPick(d.iso)}>${d.day}</button>`)}
            </div>
            <div class="dp-quick">
              <button onClick=${() => onPick(today)}>today</button>
              <button onClick=${() => onPick(shiftDay(today, 1))}>tomorrow</button>
              <button onClick=${() => onPick(shiftDay(today, 7))}>next week</button>
              <button class="clear" onClick=${() => onPick("")}>no date</button>
            </div>
          </div>
        </div>`;
    }

    function App() {
      const [me, setMe]   = useState(null);
      const [st, setSt]   = useState(null);
      const [tab, setTab] = useState("due");
      const [draft, setDraft] = useState({ title: "", course_id: "", due: "", size: 2 });
      const [picking, setPicking] = useState(null);   // null | "new" | a work id
      const [clearing, setClearing] = useState({});
      const clearTimers = useRef({});

      async function refresh() {
        const r = await frame.api("api/list").catch(() => null);
        if (r && r.courses) setSt(r);
      }
      const write = (path, body) => {
        if (typeof frame.busSend === "function") {
          frame.busSend({ op: path.replace(/^api\//, ""), ...(body || {}) });
          return Promise.resolve({});
        }
        return frame.api(path, body);
      };
      useEffect(() => {
        frame.api("api/whoami").then((m) => {
          if (m && m.space_color) applyChannel(document.documentElement, m.space_color);
          setMe(m);
        }).catch(() => setMe({}));
        refresh();
      }, []);
      useFramePush({ assignments_changed: refresh });
      useEffect(() => () => { for (const t of Object.values(clearTimers.current)) clearTimeout(t); }, []);

      if (!me || !st) return html`<div></div>`;
      const isEditor = !!me.is_sfi_editor;
      const today = st.today;
      const byId = Object.fromEntries(st.courses.map((c) => [c.id, c]));

      function addWork() {
        const title = draft.title.trim();
        const courseId = draft.course_id || (st.courses[0] && st.courses[0].id);
        if (!title || !courseId) return;
        write("api/work", { title, course_id: courseId, due: draft.due, weight: 0, size: draft.size }).catch(() => {});
        // keep the course, date and size — a run of adds is usually for the same class
        setDraft({ title: "", course_id: courseId, due: draft.due, size: draft.size });
      }
      function toggle(w) {
        if (!isEditor) return;
        const next = !w.done;
        if (next) {
          // Let the row play its exit before the data change removes it, so finishing
          // something reads as an event rather than a repaint.
          setClearing((c) => ({ ...c, [w.id]: true }));
          clearTimers.current[w.id] = setTimeout(() => {
            write("api/work/" + w.id + "/done", { done: 1 }).catch(() => {});
            setClearing((c) => { const n = { ...c }; delete n[w.id]; return n; });
          }, 300);
          return;
        }
        write("api/work/" + w.id + "/done", { done: 0 }).catch(() => {});
      }
      async function editWork(w) {
        if (!isEditor) return;
        const what = await frame.choose(w.title, {
          title: "Assignment",
          options: [
            { id: "grade", label: "Enter a score", icon: "ph-percent",
              detail: w.earned >= 0 ? `${w.earned} / ${w.possible}` : "not marked yet" },
            { id: "weight", label: "Weight of the course grade", icon: "ph-scales", detail: (w.weight || 0) + "%" },
            { id: "due", label: "Due date", icon: "ph-calendar-blank", detail: w.due || "none" },
            { id: "rename", label: "Rename", icon: "ph-pencil-simple" },
            { id: "remove", label: "Remove", icon: "ph-trash-simple" },
          ],
        });
        if (what === "grade") {
          const v = await frame.prompt(`Score out of ${w.possible}. Leave it empty to un-mark it.`,
            { title: "Score", value: w.earned >= 0 ? String(w.earned) : "", okLabel: "Save" });
          if (v !== null) write("api/work/" + w.id + "/grade", { earned: v });
        } else if (what === "weight") {
          const v = await frame.prompt("How much of the course grade is this worth, as a percentage?",
            { title: "Weight", value: String(w.weight || ""), okLabel: "Save" });
          if (v !== null) write("api/work/" + w.id, { weight: Number(v) || 0 });
        } else if (what === "due") {
          const v = await frame.prompt("yyyy-mm-dd, or empty for no date.", { title: "Due date", value: w.due, okLabel: "Save" });
          if (v !== null) write("api/work/" + w.id, { due: v.trim() });
        } else if (what === "rename") {
          const v = await frame.prompt("Title", { title: "Rename", value: w.title, okLabel: "Save" });
          if (v && v.trim()) write("api/work/" + w.id, { title: v.trim() });
        } else if (what === "remove") {
          if (await frame.confirm(`Remove "${w.title}"?`, { title: "Assignment", okLabel: "Remove" }))
            write("api/work/" + w.id + "/delete");
        }
      }
      async function addCourse() {
        const name = await frame.prompt("Course name", { title: "Add a course", okLabel: "Add" });
        if (!name || !name.trim()) return;
        const cr = await frame.prompt("How many credits is it worth?", { title: "Credits", value: "3", okLabel: "Add" });
        write("api/course", { name: name.trim(), credits: Number(cr) || 3 });
      }
      async function editCourse(c) {
        if (!isEditor) return;
        const what = await frame.choose(c.name, {
          title: "Course",
          options: [
            { id: "credits", label: "Credits", icon: "ph-scales", detail: String(c.credits) },
            { id: "rename", label: "Rename", icon: "ph-pencil-simple" },
            { id: "remove", label: "Remove", icon: "ph-trash-simple", detail: "Its assignments go too" },
          ],
        });
        if (what === "credits") {
          const v = await frame.prompt("Credits", { title: c.name, value: String(c.credits), okLabel: "Save" });
          if (v !== null) write("api/course/" + c.id, { credits: Number(v) || 0 });
        } else if (what === "rename") {
          const v = await frame.prompt("Course name", { title: "Rename", value: c.name, okLabel: "Save" });
          if (v && v.trim()) write("api/course/" + c.id, { name: v.trim() });
        } else if (what === "remove") {
          if (await frame.confirm(`Remove "${c.name}" and all its assignments?`, { title: "Course", okLabel: "Remove" }))
            write("api/course/" + c.id + "/delete");
        }
      }

      // ---- the work, grouped by urgency -------------------------------------------------
      // Ordered by PRESSURE, not by date. Slack is days until due minus the runway that
      // size deserves, so a huge thing due Friday sorts above a tiny thing due tomorrow —
      // which is the judgement a plain due-date list refuses to make.
      const open = st.work.filter((w) => !w.done);
      const doneList = st.work.filter((w) => w.done);
      const byPressure = (a, b) => slackOf(a, today) - slackOf(b, today)
        || (a.due || "9999").localeCompare(b.due || "9999")
        || b.size - a.size || a.added_ms - b.added_ms;

      const late    = open.filter((w) => w.due && w.due < today).sort(byPressure);
      const rest    = open.filter((w) => !(w.due && w.due < today));
      const now     = rest.filter((w) => slackOf(w, today) <= 0).sort(byPressure);
      const next    = rest.filter((w) => { const k = slackOf(w, today); return k > 0 && k <= 4; }).sort(byPressure);
      const later   = rest.filter((w) => { const k = slackOf(w, today); return k > 4 && k !== Infinity; }).sort(byPressure);
      const undated = rest.filter((w) => !w.due).sort((a, b) => b.size - a.size || a.added_ms - b.added_ms);

      // The frame names the ONE thing to pick up, which is the whole ask: "I know what I
      // need to be working on."
      const lead = late[0] || now[0] || null;
      const verdict = st.courses.length === 0 ? null
        : late.length ? html`<em class="late">${late.length}</em> overdue — start with <em class="late">${late[0].title}</em>.`
        : lead ? html`Start with <em>${lead.title}</em>.`
        : next.length ? html`Nothing pressing. <em>${next.length}</em> coming up.`
        : open.length ? html`Nothing to start yet.`
        : html`Nothing outstanding.`;

      const mode = me.is_owner ? "owner" : isEditor ? "editor" : "viewer";
      const pct = (n) => n === null ? "—" : Math.round(n) + "%";

      const workRow = (w) => {
        const c = byId[w.course_id];
        const overdue = !w.done && w.due && w.due < today;
        const sz = sizeOf(w.size);
        return html`
          <div class=${"w s" + w.size + (w.done ? " done" : "") + (clearing[w.id] ? " clearing" : "")
                       + (!w.done && lead && w.id === lead.id ? " lead" : "")} key=${w.id}>
            <button class="tick" disabled=${!isEditor}
              title=${w.done ? "Put it back" : "Mark it finished"} onClick=${() => toggle(w)}>
              <i class="ph-light ph-check"></i>
            </button>
            <div class="w-body">
              <button class="w-title" disabled=${!isEditor} onClick=${() => editWork(w)}>${w.title}</button>
              <div class="w-sub">
                ${c ? html`<span class="course" style=${"--cc: " + channelFor(c.name)}>${c.name}</span>` : null}
                <span class="sz">${sz.label}</span>
                <button class=${"dp-trigger" + (overdue ? " late" : "")} disabled=${!isEditor}
                  title=${isEditor ? "Change the due date" : ""}
                  onClick=${() => isEditor && setPicking(w.id)}>${dueLabel(w.due, today)}</button>
                ${w.weight > 0 ? html`<span class="meta">${w.weight}% of grade</span>` : null}
              </div>
            </div>
            ${w.earned >= 0 ? html`<span class="score"><b>${Math.round(w.earned / w.possible * 100)}%</b></span>` : null}
          </div>`;
      };

      return html`
        <main class=${isEditor ? "" : "read-only"}>
          <div class="header">
            <i class="ph-light ph-graduation-cap"></i>
            <h1>Assignments</h1>
            <span class="mode">${mode}</span>
            ${isEditor ? html`
              <button class="iconbtn" title="Add a course" onClick=${addCourse}>
                <i class="ph-light ph-plus"></i>
              </button>` : null}
          </div>

          ${!isEditor ? html`
            <div class="banner">
              <i class="ph-light ph-eye"></i>
              <span>${me.is_anon ? "You are looking at this board." : "You can see this board but not change it."}</span>
            </div>` : null}

          ${st.courses.length === 0
            ? html`
              <div class="empty">
                <i class="ph-light ph-graduation-cap"></i>
                <span>${isEditor ? "Add a course to start — the + is up in the corner." : "Nothing here yet."}</span>
              </div>`
            : html`
              ${verdict ? html`<div class="verdict">${verdict}</div>` : null}

              <div class="tabrow">
                <div class="seg" role="tablist">
                  <button role="tab" aria-selected=${tab === "due"} class=${tab === "due" ? "active" : ""}
                    onClick=${() => setTab("due")}>due${open.length ? " · " + open.length : ""}</button>
                  <button role="tab" aria-selected=${tab === "grades"} class=${tab === "grades" ? "active" : ""}
                    onClick=${() => setTab("grades")}>grades</button>
                </div>
                <span class="sp"></span>
                ${st.gpa !== null ? html`<span class="gpa"><b>${st.gpa.toFixed(2)}</b> gpa</span>` : null}
              </div>

              ${tab === "due" ? html`
                <div class="scroll">
                  ${open.length === 0 && doneList.length === 0
                    ? html`<div class="empty"><span>Nothing on the list. Add something below.</span></div>`
                    : html`
                      ${late.length ? html`<div class="group late">overdue</div>${late.map(workRow)}` : null}
                      ${now.length ? html`<div class="group">start now</div>${now.map(workRow)}` : null}
                      ${next.length ? html`<div class="group">start soon</div>${next.map(workRow)}` : null}
                      ${later.length ? html`<div class="group">later</div>${later.map(workRow)}` : null}
                      ${undated.length ? html`<div class="group">no date</div>${undated.map(workRow)}` : null}
                      ${doneList.length ? html`<div class="group">finished</div>${doneList.slice(0, 30).map(workRow)}` : null}
                    `}
                </div>

                ${isEditor ? html`
                  <div class="add">
                    <i class="ph-light ph-plus"></i>
                    <input class="f-title" maxlength="200" placeholder="Add an assignment…" value=${draft.title}
                      onInput=${(e) => setDraft({ ...draft, title: e.target.value })}
                      onKeyDown=${(e) => { if (e.key === "Enter") addWork(); }} />
                    <select class="f-course" value=${draft.course_id || st.courses[0].id}
                      onChange=${(e) => setDraft({ ...draft, course_id: e.target.value })}>
                      ${st.courses.map((c) => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
                    </select>
                    <button class="szbtn" title="How big a job is it?"
                      onClick=${() => setDraft({ ...draft, size: draft.size === 3 ? 1 : draft.size + 1 })}>
                      ${sizeOf(draft.size).label}
                    </button>
                    <button class="szbtn" title="When is it due?" onClick=${() => setPicking("new")}>
                      ${draft.due ? dueLabel(draft.due, today) : "no date"}
                    </button>
                  </div>` : null}
              ` : html`
                <div class="scroll">
                  <div class="cards">
                    ${st.courses.map((c) => {
                      const col = channelFor(c.name);
                      const gradedPct = c.assigned_weight > 0 ? (c.graded_weight / c.assigned_weight) * 100 : 0;
                      return html`
                        <div class="cc" key=${c.id} style=${"--cc-col: " + col}>
                          <div class="fig">
                            <span class=${"n" + (c.pct === null ? " none" : "")}>${pct(c.pct)}</span>
                            <span class="unit">${c.letter ? c.letter + " · " : ""}${c.credits} cr</span>
                          </div>
                          <div class="cc-body">
                            <button class="cc-name" disabled=${!isEditor} onClick=${() => editCourse(c)}>${c.name}</button>
                            <div class="bar" title=${Math.round(c.graded_weight) + "% of the course marked so far"}>
                              <div class="g" style=${"width:" + Math.min(100, gradedPct) + "%"}></div>
                              <div class="a" style=${"width:" + Math.max(0, 100 - gradedPct) + "%"}></div>
                            </div>
                            <span class="cc-meta">
                              ${c.pct === null
                                ? "nothing marked yet"
                                : Math.round(c.graded_weight) + "% of the grade marked" +
                                  (c.assigned_weight < 100 ? " · " + Math.round(c.assigned_weight) + "% assigned" : "")}
                            </span>
                          </div>
                        </div>`;
                    })}
                  </div>
                </div>
              `}
            `}

          ${picking ? html`
            <${DateSheet}
              value=${picking === "new" ? draft.due : (st.work.find((w) => w.id === picking) || {}).due || ""}
              today=${today}
              onPick=${(iso) => {
                if (picking === "new") setDraft({ ...draft, due: iso });
                else write("api/work/" + picking, { due: iso }).catch(() => {});
                setPicking(null);
              }}
              onClose=${() => setPicking(null)} />` : null}
        </main>`;
    }

    render(html`<${App} />`, document.getElementById("app"));
  </script>
</body>
</html>
