<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery List</title>
  <link rel="stylesheet" href="dyn/frame-prefs.css">
  <style>
    :root { --ch: var(--os-c1); }   /* follows the space channel at runtime via applyChannel */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: var(--os-font-sans); background: var(--os-bg);
      color: var(--os-text); font-size: var(--os-fs-base);
    }
    main {
      height: 100%; max-width: 1040px; margin: 0 auto;
      display: flex; flex-direction: column; gap: var(--os-sp-md);
      padding: clamp(var(--os-sp-md), 3vw, var(--os-sp-xl));
    }

    .header { display: flex; align-items: center; gap: var(--os-sp-sm); }
    .header i {
      font-size: 20px; color: var(--ch);
      display: inline-flex; width: 24px; height: 24px;
      align-items: center; justify-content: center; line-height: 1;
    }
    .header h1 { margin: 0; font-size: var(--os-fs-lg); font-weight: var(--os-weight-semibold); line-height: 24px; }
    .header .mode {
      margin-left: auto; font-size: var(--os-fs-2xs); color: var(--os-text-muted);
      font-feature-settings: 'tnum' 1; text-transform: lowercase; white-space: nowrap;
    }

    /* the data drawer — ONE quiet button for a configuration most people never touch.
       Owner-only (nobody else sees it), no state text at rest: where the rows live is
       not news, it's a setting. Everything (storage state, graduation) lives behind it.
       The glyph is the platform's Tables icon (ph-dresser, the pivot-nav rail) so the
       frame and the OS say "tables" the same way. See docs/table-graduation.md. */
    .drawer {
      flex: 0 0 auto; position: relative;
      width: 24px; height: 24px; padding: 0;
      background: none; border: 0; border-radius: var(--os-radius-sm); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--os-text-subtle); font-size: 16px; line-height: 1;
      transition: color 150ms, background 150ms;
    }
    /* the glyph must outrank the .header i channel-tint rule above, exactly as the
       old storage chip's icon did: this button is neutral chrome, never channel. */
    .drawer i { font-size: 16px; line-height: 1; color: inherit; width: auto; height: auto; }
    .drawer:hover { color: var(--os-text); background: var(--os-bg-subtle); }
    .drawer:active { transform: scale(0.92); }
    .drawer:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }
    /* the ONE ambient signal, and it is rare: a channel dot while a move is unfinished */
    .drawer.pending::after {
      content: ""; position: absolute; top: 0; right: 0;
      width: 5px; height: 5px; border-radius: var(--os-radius-full); background: var(--ch);
      animation: drawer-breathe 2s ease-in-out infinite;
    }
    @keyframes drawer-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .drawer.pending::after { animation: none; } }

    /* progress line — how the shop is going. Thin channel meter, tnum count. */
    .progress {
      display: flex; align-items: center; gap: var(--os-sp-md); flex: 0 0 auto;
      font-size: var(--os-fs-sm); color: var(--os-text-secondary); font-feature-settings: 'tnum' 1;
      white-space: nowrap;
    }
    .meter { flex: 1; height: 3px; background: var(--os-bg-inset); border-radius: var(--os-radius-full); overflow: hidden; }
    .meter div { height: 100%; background: var(--ch); border-radius: var(--os-radius-full); transition: width var(--os-transition-normal); }

    .banner {
      display: flex; align-items: center; gap: var(--os-sp-xs);
      background: var(--os-bg-inset); border-radius: var(--os-radius-md);
      padding: var(--os-sp-sm) var(--os-sp-md); font-size: var(--os-fs-sm); color: var(--os-text-secondary);
      flex: 0 0 auto;
    }

    /* ---- add strip (pinned above the list) ------------------------------------------
       One recessed well: rest = bg-inset (a place to type, sitting below the content),
       focus-within lifts the WHOLE strip to surface with a hairline ring. The fields
       inside never paint their own boxes — one instrument, not inputs inside an input.
       Segments separate with hairlines. */
    .add {
      display: flex; align-items: center; flex: 0 0 auto;
      /* the strip is one row of fields, so it keeps a row's measure — let it span a
         wide frame and "qty"/"aisle" end up half a screen from the item being typed */
      width: 100%; max-width: 560px;
      background: var(--os-bg-inset); border: 0; border-radius: var(--os-radius-md);
      padding: 2px var(--os-sp-xs);
      transition: background 150ms, box-shadow 150ms;
    }
    .add:focus-within { background: var(--os-bg-surface); box-shadow: inset 0 0 0 1px var(--os-border-color); }
    .add i { color: var(--os-text-subtle); font-size: 14px; line-height: 0; flex: 0 0 auto; margin: 0 var(--os-sp-xs); }
    .add input {
      display: block; border: 0; background: transparent; box-shadow: none; font: inherit;
      font-size: var(--os-fs-sm); color: var(--os-text); padding: 6px var(--os-sp-sm); width: 100%;
    }
    .add input:focus { outline: none; background: transparent; box-shadow: none; }
    .add input.f-item { flex: 1 1 auto; width: auto; }
    .add input.f-qty { flex: 0 0 72px; width: 72px; border-left: 1px solid var(--os-border-color-subtle); }
    .add input.f-cat { flex: 0 1 110px; width: auto; border-left: 1px solid var(--os-border-color-subtle); }
    .read-only .add { display: none; }

    /* ---- the list, grouped by aisle -------------------------------------------------
       An aisle is a unit, so the list is a grid OF aisles, not one tall column. In a
       phone-width frame that resolves to a single column; give it more room and the
       aisles sit side by side (auto-fill, no breakpoints) so a big frame shows the
       whole shop at once instead of scrolling a 560px ribbon down the middle. Column
       width is the row measure — items never stretch past it however wide the frame. */
    .list {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      display: grid; align-content: start;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      column-gap: var(--os-sp-xl); row-gap: var(--os-sp-xl);   /* group -> group is a true break (PRECISION §1) */
      padding-bottom: var(--os-sp-sm);
    }
    .group { display: flex; flex-direction: column; gap: var(--os-sp-xs); min-width: 0; }
    .group-head {
      font-size: 11px; font-weight: var(--os-weight-semibold);
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--os-text-muted);
    }
    .row {
      display: flex; align-items: center; gap: var(--os-sp-sm);
      padding: var(--os-sp-xs); border-radius: var(--os-radius-sm); transition: background 150ms;
    }
    .row:hover { background: var(--os-bg-subtle); }
    .row .label { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: var(--os-sp-sm); }
    main:not(.read-only) .row .label { cursor: pointer; }
    .row .txt { min-width: 0; word-break: break-word; }
    .row .qty {
      font-size: var(--os-fs-sm); color: var(--os-text-muted);
      font-feature-settings: 'tnum' 1; white-space: nowrap;
    }
    .row.checked .txt { color: var(--os-text-muted); text-decoration: line-through; }
    /* viewers keep the binary read (fill = in the cart): legible, just not interactive */
    .read-only .row input[type="checkbox"]:disabled { opacity: 1; cursor: default; }

    /* provenance dot — this row was sent from the meal planner. The dot is the hint;
       the title tooltip carries the words. Sits WITH the content it annotates (right
       after the item text), never orphaned at the row's far edge. */
    .src {
      flex: 0 0 auto; width: 14px; height: 14px; align-self: center;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .src::before {
      content: ""; width: 6px; height: 6px; border-radius: var(--os-radius-full);
      background: var(--ch);
    }

    /* hover-reveal armed delete (bare ghost, binary reveal) */
    .trash {
      flex: 0 0 auto; background: none; border: 0; cursor: pointer; padding: 4px;
      font-size: 16px; line-height: 0; color: var(--os-text-subtle);
      opacity: 0; transition: opacity 150ms, color 150ms; display: flex; align-items: center;
      border-radius: var(--os-radius-sm);
    }
    .row:hover .trash { opacity: 1; }
    .trash:hover { color: var(--os-cError); }
    .trash:active { transform: scale(0.92); }
    .trash.armed { opacity: 1; color: var(--os-cError); background: var(--os-cError-muted); }
    .trash:focus-visible { outline: none; box-shadow: var(--os-focus-ring); opacity: 1; }
    .read-only .trash { display: none; }

    /* ---- footer sweep --------------------------------------------------------------- */
    .foot { flex: 0 0 auto; display: flex; }
    .clear {
      font: inherit; font-size: var(--os-fs-sm); cursor: pointer;
      background: transparent; border: 1px solid var(--os-border-color);
      color: var(--os-text-secondary); border-radius: var(--os-radius-sm);
      padding: calc(var(--os-sp-xs) + 1px) var(--os-sp-md);
      transition: color 150ms, border-color 150ms;
    }
    .clear:hover { color: var(--os-cError); border-color: var(--os-cError); }
    .clear.armed { color: var(--os-cError); border-color: var(--os-cError); background: var(--os-cError-muted); }
    .clear:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }

    .empty { color: var(--os-text-muted); font-size: var(--os-fs-sm); text-align: center; padding: var(--os-sp-lg); flex: 1; }

    /* waiting-for-binding notice (graduated placement, binding not resolved yet) */
    .notice {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--os-sp-sm); text-align: center; padding: var(--os-sp-xl);
    }
    .notice i { font-size: 28px; color: var(--os-text-subtle); }
    .notice h2 { margin: 0; font-size: var(--os-fs-md); font-weight: var(--os-weight-semibold); }
    .notice p { margin: 0; font-size: var(--os-fs-sm); color: var(--os-text-secondary); max-width: 380px; }

    .data-ghost {
      font: inherit; font-size: var(--os-fs-sm); cursor: pointer;
      background: transparent; border: 1px solid var(--os-border-color);
      color: var(--os-text-secondary); border-radius: var(--os-radius-sm);
      padding: calc(var(--os-sp-xs) + 1px) var(--os-sp-md);
      transition: color 150ms, border-color 150ms;
    }
    .data-ghost:hover { color: var(--os-text); border-color: var(--os-text-subtle); }
  </style>
</head>
<body>
  <script type="module">
    import { frame, html, render, useState, useEffect, useRef, useFramePush, applyChannel } from "./lib/js/framelib.js";

    function App() {
      const [me, setMe]           = useState(null);
      const [items, setItems]     = useState(null);     // null until first load
      const [storage, setStorage] = useState(null);     // { backend, pending, can_manage }
      const [waiting, setWaiting] = useState(false);    // graduated placement, binding missing
      const [draft, setDraft]     = useState({ item: "", quantity: "", category: "" });
      const [armed, setArmed]     = useState(null);     // id of the delete-armed row
      const [clearArmed, setClearArmed] = useState(false);
      const armTimer   = useRef(null);
      const clearTimer = useRef(null);

      async function refresh() {
        const r = await frame.api("api/list").catch(() => null);
        if (!r) return;
        if (r.storage) setStorage(r.storage);
        setWaiting(!!r.waiting_for_binding);
        if (r.items) setItems(r.items);
      }
      // Writes go over the tether (frame.busSend) — fire-and-forget; the list refreshes
      // from the grocery_changed push, sender included. Feature-detect: an older viewer's
      // framelib has no busSend, so fall back to the HTTP write it was using before.
      const write = (path, body) => {
        if (typeof frame.busSend === "function") {
          frame.busSend({ op: path.replace(/^api\//, ""), ...(body || {}) });
          return Promise.resolve({});
        }
        return frame.api(path, body);
      };
      useEffect(() => {
        frame.api("api/whoami").then((m) => {
          if (m && m.space_color) applyChannel(document.documentElement, m.space_color);
          setMe(m);
        }).catch(() => setMe({}));
        refresh();
      }, []);
      useFramePush({ grocery_changed: refresh });

      if (!me || items === null && !waiting) return html`<div></div>`;
      const isEditor = !!me.is_sfi_editor;
      const all = items || [];

      // ---- mutations -------------------------------------------------------------------
      function addItem() {
        const item = draft.item.trim();
        if (!item) return;
        write("api/item", { item, quantity: draft.quantity.trim(), category: draft.category.trim() }).catch(() => {});
        setDraft({ item: "", quantity: "", category: draft.category });   // keep the aisle for a run of adds
      }
      // Optimistic: flip locally, reconcile from the push — checking off must feel instant.
      function toggle(it) {
        if (!isEditor) return;
        const checked = Number(it.checked) ? 0 : 1;
        setItems((xs) => xs && xs.map((x) => x.id === it.id ? { ...x, checked } : x));
        write("api/item/" + it.id, { checked }).catch(() => {});
      }
      function trash(id) {
        if (armed !== id) {
          setArmed(id);
          if (armTimer.current) clearTimeout(armTimer.current);
          armTimer.current = setTimeout(() => setArmed(null), 2500);
          return;
        }
        setArmed(null);
        if (armTimer.current) clearTimeout(armTimer.current);
        setItems((xs) => xs && xs.filter((x) => x.id !== id));
        write("api/item/" + id + "/delete", {}).catch(() => {});
      }
      function clearBought() {
        if (!clearArmed) {
          setClearArmed(true);
          if (clearTimer.current) clearTimeout(clearTimer.current);
          clearTimer.current = setTimeout(() => setClearArmed(false), 2500);
          return;
        }
        setClearArmed(false);
        if (clearTimer.current) clearTimeout(clearTimer.current);
        setItems((xs) => xs && xs.filter((x) => !Number(x.checked)));
        write("api/clear_checked", {}).catch(() => {});
      }

      // ---- the data drawer (owner-only) --------------------------------------------------
      // One button, one surface: the frame says nothing about storage at rest, and every
      // data action lives here. Single call site so #755 (frame-chrome data controls) can
      // replace this wholesale. See docs/table-graduation.md.
      async function onDrawer() {
        if (storage.pending) {
          const stop = await frame.confirm("Stop the move to a shared table?", {
            title: "List data", okLabel: "Stop", cancelLabel: "Keep going",
          });
          if (stop) { await write("api/data/cancel_graduate", {}).catch(() => null); refresh(); }
          return;
        }
        if (storage.backend === "shared") {
          await frame.alert("This list's items live in a shared table, so other frames in this space can work with the same rows.", { title: "List data" });
          return;
        }
        const mode = frame.choose
          ? await frame.choose("These items live on this device.", {
              title: "List data",
              options: [
                { id: "convert", label: "Move to a shared table", icon: "ph-dresser",
                  detail: "Copies this list so other frames can use it" },
                { id: "adopt", label: "Use an existing shared table", icon: "ph-plugs-connected",
                  detail: "Point this list at a table you already have" },
              ],
            })
          : ((await frame.confirm("Move this list's data to a shared table?", { title: "List data", okLabel: "Move" })) ? "convert" : null);
        if (mode) { await write("api/data/graduate", { mode }).catch(() => null); refresh(); }
      }

      // ---- grouping: aisles A→Z, uncategorized last; checked rows sink per group -------
      const byCat = new Map();
      for (const it of all) {
        const cat = it.category || "";
        if (!byCat.has(cat)) byCat.set(cat, []);
        byCat.get(cat).push(it);
      }
      const catNames = [...byCat.keys()].filter((c) => c).sort();
      if (byCat.has("")) catNames.push("");
      const groups = catNames.map((cat) => ({
        cat,
        rows: [...byCat.get(cat)].sort((a, b) =>
          (Number(a.checked) ? 1 : 0) - (Number(b.checked) ? 1 : 0) || a.added_ms - b.added_ms),
      }));
      const knownCats = [...new Set(all.map((x) => x.category).filter(Boolean))].sort();

      const inCart = all.filter((x) => Number(x.checked)).length;
      const mode = me.is_owner ? "owner" : isEditor ? "editor" : "viewer";

      return html`
        <main class=${isEditor ? "" : "read-only"}>
          <div class="header">
            <i class="ph-light ph-basket"></i>
            <h1>Grocery List</h1>
            <span class="mode">${mode}</span>
            ${storage && storage.can_manage ? html`
              <button class=${"drawer" + (storage.pending ? " pending" : "")}
                title=${storage.pending ? "Finishing a move to a shared table" : "List data"}
                onClick=${onDrawer}>
                <i class="ph-light ph-dresser"></i>
              </button>` : null}
          </div>

          ${!waiting && all.length > 0 ? html`
            <div class="progress">
              <span>${inCart} of ${all.length} in the cart</span>
              <div class="meter"><div style=${"width:" + Math.round(inCart / all.length * 100) + "%"}></div></div>
            </div>` : null}

          ${!isEditor ? html`
            <div class="banner">
              <i class="ph-light ph-eye"></i>
              ${me.is_sfi_member
                ? html`You have viewer-only access. Ask the owner to raise your role to edit this list.`
                : html`You're viewing this list publicly. Join this space to add and check off items.`}
            </div>` : null}

          ${waiting ? html`
            <div class="notice">
              <i class="ph-light ph-table"></i>
              <h2>Almost there</h2>
              <p>${me.is_owner
                ? html`Pick the grocery table to finish.`
                : html`The owner is finishing this list's move to shared tables.`}</p>
              ${me.is_owner ? html`<button class="data-ghost" onClick=${refresh}>Open the picker again</button>` : null}
            </div>`
          : html`
            ${isEditor ? html`
              <div class="add">
                <i class="ph-light ph-plus"></i>
                <input class="f-item" placeholder="Add an item…" maxlength="200"
                  value=${draft.item}
                  onInput=${(e) => setDraft({ ...draft, item: e.target.value })}
                  onKeyDown=${(e) => { if (e.key === "Enter") addItem(); }} />
                <input class="f-qty" placeholder="qty" maxlength="40"
                  value=${draft.quantity}
                  onInput=${(e) => setDraft({ ...draft, quantity: e.target.value })}
                  onKeyDown=${(e) => { if (e.key === "Enter") addItem(); }} />
                <input class="f-cat" placeholder="aisle" maxlength="40" list="aisles"
                  value=${draft.category}
                  onInput=${(e) => setDraft({ ...draft, category: e.target.value })}
                  onKeyDown=${(e) => { if (e.key === "Enter") addItem(); }} />
                <datalist id="aisles">
                  ${knownCats.map((c) => html`<option key=${c} value=${c}></option>`)}
                </datalist>
              </div>` : null}

            ${all.length === 0
              ? html`<div class="empty">${isEditor ? "Nothing on the list. The box above starts it." : "Nothing here yet."}</div>`
              : html`
                <div class="list">
                  ${groups.map((g) => html`
                    <div class="group" key=${g.cat || "__other"}>
                      <div class="group-head">${g.cat || "other things"}</div>
                      ${g.rows.map((it) => html`
                        <div class=${"row" + (Number(it.checked) ? " checked" : "")} key=${it.id}>
                          <input type="checkbox" checked=${!!Number(it.checked)}
                            disabled=${!isEditor} onChange=${() => toggle(it)} />
                          <span class="label" onClick=${isEditor ? () => toggle(it) : null}>
                            <span class="txt">${it.item}</span>
                            ${it.quantity ? html`<span class="qty">${it.quantity}</span>` : null}
                            ${it.source ? html`<span class="src" title="sent from the meal planner"></span>` : null}
                          </span>
                          <button class=${"trash" + (armed === it.id ? " armed" : "")}
                            title=${armed === it.id ? "Click again to delete" : "Delete"}
                            onClick=${() => trash(it.id)}>
                            <i class=${"ph-light " + (armed === it.id ? "ph-trash" : "ph-trash-simple")}></i>
                          </button>
                        </div>
                      `)}
                    </div>
                  `)}
                </div>`}

            ${isEditor && inCart > 0 ? html`
              <div class="foot">
                <button class=${"clear" + (clearArmed ? " armed" : "")} onClick=${clearBought}>
                  ${clearArmed ? "click again to clear " + inCart + " bought" : "clear bought"}
                </button>
              </div>` : null}`}
        </main>
      `;
    }

    render(html`<${App}/>`, document.body);
  </script>
</body>
</html>
