<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gift List</title>
  <link rel="stylesheet" href="dyn/frame-prefs.css">
  <style>
    :root { --ch: var(--os-c1); }   /* follows the space channel at runtime via applyChannel */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    /* the render root carries the height too, or `main { height: 100% }` resolves
       against an auto-height div and the frame stops driving its own layout */
    html, body, #app { height: 100%; }
    body {
      margin: 0; font-family: var(--os-font-sans); background: var(--os-bg);
      color: var(--os-text); font-size: var(--os-fs-base);
    }
    main {
      height: 100%; max-width: 960px; margin: 0 auto;
      display: flex; flex-direction: column; gap: var(--os-sp-md);
      padding: clamp(var(--os-sp-md), 3vw, var(--os-sp-xl));
    }

    /* ---- header rail (24px first line; see PRECISION §6) --------------------------- */
    .header { display: flex; align-items: center; gap: var(--os-sp-sm); flex: 0 0 auto; }
    .header > i {
      flex: 0 0 auto; width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 20px; line-height: 1; color: var(--ch);
    }
    .header h1 {
      flex: 1 1 auto; min-width: 0; margin: 0;
      font-size: var(--os-fs-lg); font-weight: var(--os-weight-semibold); line-height: 24px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header .mode {
      flex: 0 0 auto; height: 24px; display: inline-flex; align-items: center;
      font-size: var(--os-fs-2xs); color: var(--os-text-muted); white-space: nowrap;
    }
    .drawer {
      flex: 0 0 auto; position: relative;
      width: 24px; height: 24px; padding: 0;
      background: none; border: 0; border-radius: var(--os-radius-sm); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--os-text-subtle); font-size: 16px; line-height: 1;
      transition: color 150ms, background 150ms;
    }
    /* the glyph must outrank the .header > i channel-tint rule above */
    .drawer i { font-size: 16px; line-height: 1; color: inherit; width: auto; height: auto; }
    .drawer:hover { color: var(--os-text); background: var(--os-bg-subtle); }
    .drawer:active { transform: scale(0.92); }
    .drawer:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }
    .drawer.pending::after {
      content: ""; position: absolute; top: 0; right: 0;
      width: 5px; height: 5px; border-radius: var(--os-radius-full); background: var(--ch);
      animation: drawer-breathe 2s ease-in-out infinite;
    }
    @keyframes drawer-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .drawer.pending::after { animation: none; } }

    .banner {
      display: flex; align-items: center; gap: var(--os-sp-xs);
      background: var(--os-bg-inset); border-radius: var(--os-radius-md);
      padding: var(--os-sp-sm) var(--os-sp-md); font-size: var(--os-fs-sm); color: var(--os-text-secondary);
      flex: 0 0 auto;
    }

    /* ---- add strip: keeps a row's measure so "for" stays beside the wish ------------- */
    .add {
      display: flex; align-items: center; flex: 0 0 auto;
      width: 100%; max-width: 560px;
      background: var(--os-bg-inset); border: 0; border-radius: var(--os-radius-md);
      padding: 2px var(--os-sp-xs);
      transition: background 150ms, box-shadow 150ms;
    }
    .add:focus-within { background: var(--os-bg-surface); box-shadow: inset 0 0 0 1px var(--os-border-color); }
    .add > i { color: var(--os-text-subtle); font-size: 14px; line-height: 0; flex: 0 0 auto; margin: 0 var(--os-sp-xs); }
    .add input {
      display: block; border: 0; background: transparent; box-shadow: none; font: inherit;
      font-size: var(--os-fs-sm); color: var(--os-text); padding: 6px var(--os-sp-sm);
      width: 100%; min-width: 0;
    }
    .add input:focus { outline: none; background: transparent; box-shadow: none; }
    .add input.f-item { flex: 1 1 0; width: auto; }
    .add input.f-for { flex: 0 1 120px; width: auto; border-left: 1px solid var(--os-border-color-subtle); }
    .read-only .add { display: none; }

    /* ---- the lists ------------------------------------------------------------------
       One panel per person. The asymmetry IS the design: your own list is tinted and
       carries the note about what you are not being shown, everyone else's is plain and
       carries the tags. */
    .lists {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      display: grid; align-content: start;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--os-sp-lg); padding: 2px; padding-bottom: var(--os-sp-sm);
    }
    .list {
      display: flex; flex-direction: column; gap: var(--os-sp-xs); min-width: 0;
      background: var(--os-bg-surface); border: 1px solid var(--os-border-color-subtle);
      border-radius: var(--os-radius-md); padding: var(--os-sp-md);
    }
    .list.mine { background: color-mix(in srgb, var(--ch), var(--os-bg-surface) 95%); }

    .l-head { display: flex; align-items: center; gap: var(--os-sp-sm); min-width: 0; margin-bottom: 2px; }
    .l-badge {
      flex: 0 0 22px; width: 22px; height: 22px; border-radius: var(--os-radius-full);
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--ch); color: var(--ch-fg, var(--os-c1-fg));
      font-size: var(--os-fs-2xs); font-weight: var(--os-weight-semibold); text-transform: uppercase;
    }
    .l-name {
      flex: 1 1 auto; min-width: 0; font-weight: var(--os-weight-semibold); font-size: var(--os-fs-sm);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .wish {
      display: flex; align-items: flex-start; gap: var(--os-sp-sm); min-width: 0;
      padding: var(--os-sp-xs); border-radius: var(--os-radius-sm);
      transition: background 150ms;
    }
    .wish:hover { background: var(--os-bg-subtle); }
    /* a wish you are handling gets the soft channel fill — the same "this one is mine"
       idiom every other selected row in the app uses, never an edge rail */
    .wish.taken { background: color-mix(in srgb, var(--ch), transparent 88%); }
    .wish.taken:hover { background: color-mix(in srgb, var(--ch), transparent 82%); }
    .w-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .w-item { word-break: break-word; font-size: var(--os-fs-sm); }
    .w-note { font-size: var(--os-fs-2xs); color: var(--os-text-muted); word-break: break-word; }
    .w-link {
      font-size: var(--os-fs-2xs); color: var(--ch); background: none; border: 0; padding: 0;
      cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px;
      align-self: flex-start;
    }
    .w-link:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }

    /* THE ONE FUN MOMENT: claiming ties a tag on the gift. The tag blooms in rather than
       appearing, so putting your name on something feels like a small act. */
    .tag {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px;
      background: var(--ch); color: var(--ch-fg, var(--os-c1-fg));
      border: 0; border-radius: var(--os-radius-full);
      padding: 2px var(--os-sp-sm); cursor: default;
      font: inherit; font-size: var(--os-fs-2xs); white-space: nowrap;
      animation: tie-on 220ms var(--os-ease-spring);
    }
    .tag i { font-size: 12px; line-height: 0; }
    @keyframes tie-on {
      0%   { transform: scale(0.86) rotate(-4deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .tag { animation: none; } }
    button.tag { cursor: pointer; transition: filter 150ms, transform 80ms var(--os-ease-spring); }
    button.tag:hover { filter: brightness(1.08); }
    button.tag:active { transform: scale(0.92); }
    button.tag:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }

    /* the claim affordance stays quiet until you look at the row */
    .claim {
      flex: 0 0 auto; background: none; border: 1px solid var(--os-border-color);
      border-radius: var(--os-radius-full); padding: 2px var(--os-sp-sm); cursor: pointer;
      font: inherit; font-size: var(--os-fs-2xs); color: var(--os-text-secondary);
      opacity: 0; transition: opacity 150ms, color 150ms, border-color 150ms, background 150ms;
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .claim i { font-size: 12px; line-height: 0; }
    .wish:hover .claim, .claim:focus-visible { opacity: 1; }
    .claim:hover { color: var(--ch); border-color: var(--ch); background: color-mix(in srgb, var(--ch), transparent 92%); }
    .claim:active { transform: scale(0.94); }
    .claim:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }

    .trash {
      flex: 0 0 auto; background: none; border: 0; cursor: pointer; padding: 2px;
      font-size: 14px; line-height: 0; color: var(--os-text-subtle);
      opacity: 0; transition: opacity 150ms, color 150ms; display: flex; align-items: center;
      border-radius: var(--os-radius-sm);
    }
    .wish:hover .trash { opacity: 1; }
    .trash:hover { color: var(--os-cError); }
    .trash:active { transform: scale(0.92); }
    .trash.armed { opacity: 1; color: var(--os-cError); background: var(--os-cError-muted); }
    .trash:focus-visible { outline: none; box-shadow: var(--os-focus-ring); opacity: 1; }
    .read-only .trash, .read-only .claim { display: none; }

    /* the honest note at the foot of your own list */
    .kept {
      margin-top: var(--os-sp-xs); padding-top: var(--os-sp-sm);
      border-top: 1px dashed var(--os-border-color-subtle);
      display: flex; align-items: flex-start; gap: var(--os-sp-xs);
      font-size: var(--os-fs-2xs); color: var(--os-text-muted); line-height: 1.45;
    }
    .kept i { flex: 0 0 auto; font-size: 13px; line-height: 1.2; color: var(--ch); }

    .notice {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--os-sp-sm); text-align: center; padding: var(--os-sp-xl); flex: 1;
    }
    .notice i { font-size: 28px; color: var(--os-text-subtle); }
    .notice p { margin: 0; font-size: var(--os-fs-sm); color: var(--os-text-secondary); max-width: 380px; }
    .empty { color: var(--os-text-muted); font-size: var(--os-fs-sm); text-align: center; padding: var(--os-sp-lg); flex: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { frame, html, render, useState, useEffect, useRef, useFramePush, applyChannel } from "./lib/js/framelib.js";

    // A person's colour must be the SAME on every device, so it is derived from the name
    // rather than handed out in arrival order. 12 channels, the platform's own palette.
    function channelFor(name) {
      let h = 0;
      for (const c of String(name)) h = (h * 31 + c.codePointAt(0)) >>> 0;
      return "var(--os-c" + (h % 12 + 1) + ")";
    }
    const initial = (name) => (String(name).trim()[0] || "?");

    function App() {
      const [me, setMe]           = useState(null);
      const [wishes, setWishes]   = useState(null);
      const [meName, setMeName]   = useState("");
      const [storage, setStorage] = useState(null);
      const [waiting, setWaiting] = useState(false);
      const [draft, setDraft]     = useState({ item: "", for_who: "" });
      const [armed, setArmed]     = useState(null);
      const armTimer = useRef(null);

      async function refresh() {
        const r = await frame.api("api/list").catch(() => null);
        if (!r) return;
        if (r.storage) setStorage(r.storage);
        if (r.me_name != null) setMeName(r.me_name);
        setWaiting(!!r.waiting_for_binding);
        if (r.wishes) setWishes(r.wishes);
      }
      const write = (path, body) => {
        if (typeof frame.busSend === "function") {
          frame.busSend({ op: path.replace(/^api\//, ""), ...(body || {}) });
          return Promise.resolve({});
        }
        return frame.api(path, body);
      };
      useEffect(() => {
        frame.api("api/whoami").then((m) => {
          if (m && m.space_color) applyChannel(document.documentElement, m.space_color);
          setMe(m);
        }).catch(() => setMe({}));
        refresh();
      }, []);
      useFramePush({ wishes_changed: refresh });

      if (!me || wishes === null && !waiting) return html`<div></div>`;
      const isEditor = !!me.is_sfi_editor;
      const all = wishes || [];

      function addWish() {
        const item = draft.item.trim();
        if (!item) return;
        write("api/wish", { item, for_who: draft.for_who.trim() }).catch(() => {});
        setDraft({ item: "", for_who: draft.for_who });   // keep "for" for a run of adds
      }
      function claim(w) {
        write("api/wish/" + w.id + (w.claimed_by_me ? "/unclaim" : "/claim"), {}).catch(() => {});
      }
      function trash(w) {
        if (armed !== w.id) {
          setArmed(w.id);
          if (armTimer.current) clearTimeout(armTimer.current);
          armTimer.current = setTimeout(() => setArmed(null), 2500);
          return;
        }
        setArmed(null);
        if (armTimer.current) clearTimeout(armTimer.current);
        setWishes((xs) => xs && xs.filter((x) => x.id !== w.id));
        write("api/wish/" + w.id + "/delete", {}).catch(() => {});
      }
      function openLink(url) {
        // The host asks the user before anything leaves the sandbox; if this build has no
        // opener, the address stays visible as text rather than silently doing nothing.
        if (typeof frame.openExternalUrl === "function") frame.openExternalUrl(url);
        else frame.alert(url, { title: "Link" });
      }

      // ---- the data drawer (owner-only) --------------------------------------------------
      async function onDrawer() {
        if (storage.pending) {
          const stop = await frame.confirm("Stop the move to a shared table?", {
            title: "List data", okLabel: "Stop", cancelLabel: "Keep going",
          });
          if (stop) { await write("api/data/cancel_graduate", {}).catch(() => null); refresh(); }
          return;
        }
        if (storage.backend === "shared") {
          await frame.alert("These wishes live in a shared table, so other frames in this space can work with the same rows.", { title: "List data" });
          return;
        }
        const mode = frame.choose
          ? await frame.choose("These wishes live on this device.", {
              title: "List data",
              options: [
                { id: "convert", label: "Move to a shared table", icon: "ph-dresser",
                  detail: "Copies these wishes so other frames can use them" },
                { id: "adopt", label: "Use an existing shared table", icon: "ph-plugs-connected",
                  detail: "Point this list at a table you already have" },
              ],
            })
          : ((await frame.confirm("Move this list's data to a shared table?", { title: "List data", okLabel: "Move" })) ? "convert" : null);
        if (mode) { await write("api/data/graduate", { mode }).catch(() => null); refresh(); }
      }

      // ---- one panel per person; your own list leads ----------------------------------
      const byWho = new Map();
      for (const w of all) {
        const who = w.for_who || "someone";
        if (!byWho.has(who)) byWho.set(who, []);
        byWho.get(who).push(w);
      }
      const lists = [...byWho.entries()]
        .map(([who, rows]) => ({ who, rows, mine: rows.some((r) => r.for_me) }))
        .sort((a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0) || a.who.localeCompare(b.who));

      const mode = me.is_owner ? "owner" : isEditor ? "editor" : "viewer";

      return html`
        <main class=${isEditor ? "" : "read-only"}>
          <div class="header">
            <i class="ph-light ph-gift"></i>
            <h1>Gift List</h1>
            <span class="mode">${mode}</span>
            ${storage && storage.can_manage ? html`
              <button class=${"drawer" + (storage.pending ? " pending" : "")}
                title=${storage.pending ? "Finishing a move to a shared table" : "List data"}
                onClick=${onDrawer}>
                <i class="ph-light ph-dresser"></i>
              </button>` : null}
          </div>

          ${waiting ? html`
            <div class="notice">
              <i class="ph-light ph-table"></i>
              <p>${me.is_owner
                ? "This list is moving to a shared table. Pick or create the table to finish."
                : "This list is being set up. It will be back in a moment."}</p>
            </div>`
          : html`
            ${!isEditor ? html`
              <div class="banner">
                <i class="ph-light ph-eye"></i>
                <span>${me.is_anon ? "You are looking at this list." : "You can see this list but not change it."}</span>
              </div>` : null}

            ${isEditor ? html`
              <div class="add">
                <i class="ph-light ph-plus"></i>
                <input class="f-item" maxlength="200" placeholder="Add a wish…" value=${draft.item}
                  onInput=${(e) => setDraft({ ...draft, item: e.target.value })}
                  onKeyDown=${(e) => { if (e.key === "Enter") addWish(); }} />
                <input class="f-for" maxlength="60" placeholder=${meName || "For"} value=${draft.for_who}
                  onInput=${(e) => setDraft({ ...draft, for_who: e.target.value })}
                  onKeyDown=${(e) => { if (e.key === "Enter") addWish(); }} />
              </div>` : null}

            ${all.length === 0
              ? html`<div class="empty">${isEditor ? "No wishes yet. Add the first one above." : "Nothing here yet."}</div>`
              : html`
                <div class="lists">
                  ${lists.map((L) => html`
                    <div class=${"list" + (L.mine ? " mine" : "")} key=${L.who}
                      style=${"--ch: " + channelFor(L.who)}>
                      <div class="l-head">
                        <span class="l-badge">${initial(L.who)}</span>
                        <span class="l-name">${L.mine ? "your list" : L.who}</span>
                      </div>

                      ${L.rows.map((w) => html`
                        <div class=${"wish" + (w.claimed_by_me ? " taken" : "")} key=${w.id}>
                          <div class="w-body">
                            <span class="w-item">${w.item}</span>
                            ${w.notes ? html`<span class="w-note">${w.notes}</span>` : null}
                            ${w.url ? html`<button class="w-link" onClick=${() => openLink(w.url)}>link</button>` : null}
                          </div>

                          ${w.for_me ? null
                            : w.claimed_by
                              ? (w.claimed_by_me
                                  ? html`<button class="tag" title="You are getting this — press to let it go"
                                      onClick=${() => claim(w)}>
                                      <i class="ph-light ph-check"></i>you</button>`
                                  : html`<span class="tag" title=${w.claimed_by + " is getting this"}>
                                      <i class="ph-light ph-tag"></i>${w.claimed_by}</span>`)
                              : html`<button class="claim" onClick=${() => claim(w)}>
                                  <i class="ph-light ph-tag"></i>i'll get it</button>`}

                          ${isEditor ? html`
                            <button class=${"trash" + (armed === w.id ? " armed" : "")}
                              title=${armed === w.id ? "Press again to remove" : "Remove"}
                              onClick=${() => trash(w)} onBlur=${() => setArmed(null)}>
                              <i class=${"ph-light " + (armed === w.id ? "ph-trash" : "ph-trash-simple")}></i>
                            </button>` : null}
                        </div>
                      `)}

                      ${L.mine ? html`
                        <div class="kept">
                          <i class="ph-light ph-eye-slash"></i>
                          <span>Anything claimed on your own list is hidden from you, so you can look
                            without spoiling it.</span>
                        </div>` : null}
                    </div>
                  `)}
                </div>`}
          `}
        </main>`;
    }

    render(html`<${App} />`, document.getElementById("app"));
  </script>
</body>
</html>
