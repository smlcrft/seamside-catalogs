<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roller</title>
  <link rel="stylesheet" href="/dyn/frame-prefs.css">
  <style>
    body { max-width: 320px; margin: 0 auto; }
    .die {
      font-size: 104px;
      line-height: 1;
      width: 144px; height: 144px;
      display: flex; align-items: center; justify-content: center;
      background: var(--os-bg-surface);
      border: 1px solid var(--os-border-color-subtle);
      border-radius: var(--os-radius-lg);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06), inset 0 -2px 0 rgba(0, 0, 0, 0.04);
      cursor: pointer;
      user-select: none;
      transition: transform var(--os-transition-fast);
    }
    .die:active { transform: scale(0.94); }
    .die.rolling { opacity: 0.85; }
    .result { font-size: var(--os-fs-xl); font-weight: var(--os-weight-semibold); }
  </style>
</head>
<body>
  <div class="stack center" style="min-height: 100vh; gap: var(--os-sp-lg);">
    <div class="die" id="die">?</div>
    <p class="result muted" id="result">tap to roll</p>
    <button class="ghost" id="roll-btn">
      <i class="ph-light ph-arrow-clockwise icon-sm"></i> roll again
    </button>
  </div>
  <script type="module">
    import "/lib/js/framelib.js";   // window.seamside

    const FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    const die = document.getElementById('die');
    const result = document.getElementById('result');
    let rolling = false;
    let seen = 0;   // the roll this page last showed (`n` from the worker)

    async function api(path, method = 'GET') {
      const r = await window.seamside.fetch(path, { method });
      let v = {};
      try { v = r.json(); } catch { /* no body: the status says it */ }
      if (!r.ok) throw new Error(v.error || 'Something went wrong.');
      return v;
    }

    function show(value, sides) {
      if (!value) { die.textContent = '?'; return; }
      die.textContent = (sides === 6 && value >= 1 && value <= 6) ? FACES[value - 1] : String(value);
      result.textContent = `rolled ${value}`;
      result.classList.remove('muted');
    }

    function animate(value, sides, roll_time_ms) {
      rolling = true;
      die.classList.add('rolling');
      const end = Date.now() + roll_time_ms;
      let bounces = 0;
      (function tick() {
        if (Date.now() < end) {
          die.textContent = FACES[Math.floor(Math.random() * 6)];
          setTimeout(tick, 60 + Math.random() * (bounces++) * 10);
        } else {
          show(value, sides);
          die.classList.remove('rolling');
          rolling = false;
        }
      })();
    }

    // A roll this page has not shown tumbles; the first read only shows where things stand.
    async function follow() {
      const s = await api('/api/state').catch(() => null);
      if (!s || rolling || s.n === seen) return;
      seen = s.n;
      animate(s.value, s.sides, s.roll_time_ms);
    }

    // The roller reads again once answered; the push brings everyone else.
    function roll() {
      if (rolling) return;
      api('/api/roll', 'POST').then(follow).catch(() => {});
    }

    await window.seamside.ready;

    api('/api/state').then(({ value, sides, can_roll, n }) => {
      // Rolling is an editor's; everyone else watches the same dice.
      if (!can_roll) {
        document.getElementById('roll-btn').style.display = 'none';
        die.style.cursor = 'default';
        result.textContent = 'watching the dice';
      }
      seen = n;
      show(value, sides);
    }).catch(() => {});

    window.addEventListener('message', (e) => {
      if (e.data?.game_dice_roller === 'roll') follow();
    });

    die.addEventListener('click', roll);
    document.getElementById('roll-btn').addEventListener('click', roll);
  </script>
</body>
</html>
