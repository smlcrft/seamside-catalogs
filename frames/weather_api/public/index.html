<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="dyn/frame-prefs.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--os-font-sans);
      background: var(--os-bg);
      color: var(--os-text);
      font-size: var(--os-fs-base);
      padding: var(--os-sp-lg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: var(--os-sp-md);
      overflow: hidden;
    }
    #search-row { display: flex; gap: var(--os-sp-sm); }
    #location-input { flex: 1; }
    #error { color: var(--os-cError-fg); font-size: var(--os-fs-sm); display: none; }
    #location-label {
      font-size: var(--os-fs-2xs);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--os-text-muted);
      min-height: 1.2em;
    }
    #current { display: flex; align-items: center; gap: var(--os-sp-lg); }
    #current .icon { font-size: 44px; line-height: 1; color: var(--os-text-secondary); display: flex; }
    #current .temp {
      font-size: 44px;
      font-weight: var(--os-weight-semibold);
      font-feature-settings: 'tnum' 1;
      letter-spacing: -0.02em;
    }
    #current .details {
      font-size: var(--os-fs-sm);
      color: var(--os-text-secondary);
      line-height: 1.7;
      font-feature-settings: 'tnum' 1;
    }
    #condition { font-size: var(--os-fs-md); color: var(--os-text-secondary); min-height: 1.4em; }
    #forecast { display: flex; gap: var(--os-sp-sm); flex: 0 0 auto; }
    .day {
      flex: 1;
      border-radius: var(--os-radius-md);
      padding: var(--os-sp-md) var(--os-sp-xs);
      text-align: center;
      background: var(--os-bg-subtle);
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      font-feature-settings: 'tnum' 1;
    }
    .day .day-name {
      font-size: var(--os-fs-2xs);
      color: var(--os-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .day .day-icon { font-size: 20px; color: var(--os-text-secondary); }
    .day .day-hi { font-size: var(--os-fs-base); font-weight: var(--os-weight-semibold); }
    .day .day-lo { font-size: var(--os-fs-sm); color: var(--os-text-muted); }
    .day .day-precip { font-size: var(--os-fs-2xs); color: var(--os-text-muted); }
    #updated {
      margin-top: auto;
      font-size: var(--os-fs-2xs);
      color: var(--os-text-muted);
      text-align: right;
      font-feature-settings: 'tnum' 1;
    }
  </style>
</head>
<body>
  <div id="search-row">
    <input id="location-input" type="text" placeholder="City, State or Country…" autocomplete="off" spellcheck="false">
    <button id="search-btn" class="secondary">Search</button>
  </div>
  <div id="error"></div>
  <div id="location-label"></div>
  <div id="current">
    <div class="icon" id="cur-icon"></div>
    <div class="temp" id="cur-temp"></div>
    <div class="details">
      <div>Feels like <span id="cur-feels">—</span></div>
      <div>Humidity <span id="cur-humidity">—</span></div>
      <div>Wind <span id="cur-wind">—</span></div>
    </div>
  </div>
  <div id="condition"></div>
  <div id="forecast"></div>
  <div id="updated"></div>
  <script type="module">
    import { frame } from "/lib/js/framelib.js";

    const WMO = {
      0:"Clear sky", 1:"Mainly clear", 2:"Partly cloudy", 3:"Overcast",
      45:"Fog", 48:"Icy fog",
      51:"Light drizzle", 53:"Drizzle", 55:"Heavy drizzle",
      61:"Light rain", 63:"Rain", 65:"Heavy rain",
      71:"Light snow", 73:"Snow", 75:"Heavy snow", 77:"Snow grains",
      80:"Showers", 81:"Showers", 82:"Violent showers",
      85:"Snow showers", 86:"Heavy snow showers",
      95:"Thunderstorm", 96:"Thunderstorm w/ hail", 99:"Thunderstorm w/ hail",
    };
    const WMO_ICON = {
      0:"ph-sun", 1:"ph-sun-dim", 2:"ph-cloud-sun", 3:"ph-cloud",
      45:"ph-cloud-fog", 48:"ph-cloud-fog",
      51:"ph-cloud-rain", 53:"ph-cloud-rain", 55:"ph-cloud-rain",
      61:"ph-cloud-rain", 63:"ph-cloud-rain", 65:"ph-cloud-rain",
      71:"ph-cloud-snow", 73:"ph-cloud-snow", 75:"ph-snowflake", 77:"ph-snowflake",
      80:"ph-cloud-rain", 81:"ph-cloud-rain", 82:"ph-cloud-lightning",
      85:"ph-cloud-snow", 86:"ph-snowflake",
      95:"ph-cloud-lightning", 96:"ph-cloud-lightning", 99:"ph-cloud-lightning",
    };
    function wmoLabel(code) { return WMO[code] ?? "Unknown"; }
    function wmoIcon(code) {
      return '<i class="ph-light ' + (WMO_ICON[code] ?? "ph-thermometer") + '"></i>';
    }
    // A weather field may be absent if the placement's settings.json trims it (or the API
    // omits it). Coerce to a finite number, or null so callers can render a "—" placeholder.
    function num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
    function dayName(isoDate) {
      return new Date(isoDate + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" });
    }

    const input = document.getElementById("location-input");
    const searchBtn = document.getElementById("search-btn");
    let refreshTimer = null;

    async function load(locationQuery) {
      if (!locationQuery) return;
      document.getElementById("updated").textContent = "Fetching forecast...";
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";
      try {
        const d = await frame.api("api/weather?location=" + encodeURIComponent(locationQuery));
        if (d.error) throw new Error(d.error);

        localStorage.setItem("weather_location", locationQuery);

        document.getElementById("location-label").textContent = d.location.name;
        const cur = d.current || {};
        const code = cur.weather_code;
        const temp = num(cur.temperature_2m), feels = num(cur.apparent_temperature);
        const hum = num(cur.relative_humidity_2m), wind = num(cur.wind_speed_10m);
        document.getElementById("cur-icon").innerHTML = wmoIcon(code);
        document.getElementById("cur-temp").textContent = temp != null ? Math.round(temp) + "°" : "—";
        document.getElementById("cur-feels").textContent = feels != null ? Math.round(feels) + "°" : "—";
        document.getElementById("cur-humidity").textContent = hum != null ? hum + "%" : "—";
        document.getElementById("cur-wind").textContent = wind != null ? Math.round(wind) + " mph" : "—";
        document.getElementById("condition").textContent = wmoLabel(code);

        const daily = d.daily || {};
        const days = Array.isArray(daily.time) ? daily.time : [];
        const forecastEl = document.getElementById("forecast");
        forecastEl.innerHTML = "";
        for (let i = 0; i < days.length; i++) {
          // Each daily series is optional (settings.json may trim fields), so index
          // defensively and only render a value when it's actually present.
          const hi = num(daily.temperature_2m_max?.[i]);
          const lo = num(daily.temperature_2m_min?.[i]);
          const precip = num(daily.precipitation_sum?.[i]);
          const div = document.createElement("div");
          div.className = "day";
          div.innerHTML = `
            <div class="day-name">${dayName(days[i])}</div>
            <div class="day-icon">${wmoIcon(daily.weather_code?.[i])}</div>
            <div class="day-hi">${hi != null ? Math.round(hi) + "°" : "—"}</div>
            <div class="day-lo">${lo != null ? Math.round(lo) + "°" : "—"}</div>
            <div class="day-precip">${precip != null && precip > 0 ? precip.toFixed(2) + '"' : "\u00a0"}</div>
          `;
          forecastEl.appendChild(div);
        }

        document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Re-fetch after 5 minutes (matching backend cache TTL).
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => load(locationQuery), 5.01 * 60 * 1000);
      } catch (e) {
        errorEl.textContent = e.message;
        errorEl.style.display = "block";
      }
    }

    function search() {
      const q = input.value.trim();
      if (q) load(q);
    }

    searchBtn.addEventListener("click", search);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

    // Restore last searched location on load.
    const saved = localStorage.getItem("weather_location") || "98102";
    if (saved) {
      input.value = saved;
      load(saved);
    }
  </script>
</body>
</html>
