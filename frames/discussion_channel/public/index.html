<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discussion</title>
  <link rel="stylesheet" href="/dyn/frame-prefs.css">
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <main id="app" class="dc-loading">loading…</main>
  <script type="module">
import { html, render, useState, useEffect, useRef, Fragment, useFramePush, Editable, Modal, applyChannel } from "/lib/js/framelib.js";

// Everything this page knows comes from its own server half (./api/…), which decides who
// may read and write, so this is one page wherever it was opened.
async function api(method, path, body) {
  const r = await window.seamside.fetch(`/api${path}`, { method, ...(body ? { body: JSON.stringify(body) } : {}) });
  let v = {};
  try { v = r.json(); } catch { /* the status says it */ }
  if (!r.ok) throw new Error(v.error || "Something went wrong. Try again.");
  return v;
}

// Who the door says this is, read from the worker with the channel it opens on.
let opened = null;
let userId = "";
let isOwner = false;

const DEFAULT_REACTION_ICONS = ["thumbs-up", "heart", "fire", "smiley", "hand-waving",
  "sparkle", "lightning", "rocket", "confetti", "star"];

function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  if (d.toDateString() === now.toDateString()) return `${hh}:${mm}`;
  const days = (now - d) / 86400000;
  if (days < 7) return d.toLocaleDateString(undefined, { weekday: "short" }) + ` ${hh}:${mm}`;
  return d.toLocaleDateString();
}

function Toast({ message }) {
  if (!message) return null;
  return html`<div class="dc-toast show">${message}</div>`;
}

function ReactionPicker({ icons, anchorRect, onPick, onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    setTimeout(() => document.addEventListener("mousedown", onDoc, true), 0);
    return () => document.removeEventListener("mousedown", onDoc, true);
  }, []);
  // Position after mount.
  useEffect(() => {
    const el = ref.current;
    if (!el || !anchorRect) return;
    const pw = el.offsetWidth, ph = el.offsetHeight;
    let left = Math.max(4, Math.min(window.innerWidth - pw - 4, anchorRect.left));
    let top = anchorRect.top - ph - 4;
    if (top < 4) top = Math.min(window.innerHeight - ph - 4, anchorRect.bottom + 4);
    top = Math.max(4, top);
    el.style.left = left + "px";
    el.style.top = top + "px";
  }, [anchorRect]);
  return html`<div class="dc-picker" ref=${ref}>
    ${icons.map((i) => html`<button type="button" key=${i} title=${i}
      onClick=${() => { onPick(i); onClose(); }}>
      <i class=${"ph-light ph-" + i}></i>
    </button>`)}
  </div>`;
}

function SettingsOverlay({ prefs, onClose, onSave }) {
  const [title, setTitle] = useState(prefs.title || "Discussion");
  const [publicToViewers, setPublicToViewers] = useState(prefs.public_to_space_viewers === true);
  return html`<${Modal} title="Channel settings" onClose=${onClose}
    actions=${html`
      <button class="dc-ghost-btn" onClick=${onClose}>Cancel</button>
      <button class="dc-save" onClick=${() => {
        onSave({
          title: title.trim() || "Discussion",
          public_to_space_viewers: publicToViewers,
        });
        onClose();
      }}>Save</button>`}>
    <div class="dc-settings-fields">
    <label>
      Title
      <input type="text" maxlength="80" placeholder="Discussion" autofocus
        value=${title} onInput=${(e) => setTitle(e.target.value)} />
    </label>
    <label class="dc-settings-toggle">
      <input type="checkbox" checked=${publicToViewers}
        onChange=${(e) => setPublicToViewers(e.target.checked)} />
      <span>
        <span class="dc-toggle-name">Viewer-role members can participate</span>
        <span class="dc-toggle-sub muted">Members marked Viewer can chat, react, and delete their own messages. Off: they read only.</span>
      </span>
    </label>
    </div>
  </${Modal}>`;
}

function Reactions({ message: m, canDelete, canReact, onToggle, onAddReact, onDelete }) {
  const grouped = new Map();
  for (const r of m.reactions || []) {
    let bucket = grouped.get(r.icon);
    if (!bucket) { bucket = []; grouped.set(r.icon, bucket); }
    bucket.push(r);
  }
  return html`<div class="dc-reactions">
    ${[...grouped.entries()].map(([icon, list]) => {
      const reactedByMe = list.some((r) => r.user_id === userId);
      const names = list.map((r) => r.user_name || "user").join(", ");
      return html`<button type="button" key=${icon}
        class=${"dc-reaction " + (reactedByMe ? "mine" : "")}
        title=${names} disabled=${!canReact}
        onClick=${canReact ? (() => onToggle(m.id, icon)) : undefined}>
        <i class=${"ph-light ph-" + icon}></i><span>${list.length}</span>
      </button>`;
    })}
    ${canReact && html`<button type="button" class="dc-reaction-add" title="add reaction"
      onClick=${(e) => onAddReact(m.id, e.currentTarget.getBoundingClientRect())}>
      <i class="ph-light ph-smiley-wink"></i>
    </button>`}
    ${canDelete && html`<button type="button" class="dc-msg-delete" title="delete message"
      onClick=${() => onDelete(m.id)}>
      <i class="ph-light ph-trash"></i>
    </button>`}
  </div>`;
}

function MessagesList({ messages, canParticipate, onToggle, onAddReact, onDelete }) {
  const ref = useRef(null);
  const prevLen = useRef(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const wasAtBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 32;
    if (wasAtBottom || messages.length > prevLen.current) el.scrollTop = el.scrollHeight;
    prevLen.current = messages.length;
  }, [messages]);

  if (messages.length === 0) {
    return html`<div class="dc-messages" id="dc-messages" ref=${ref}>
      <div class="dc-empty">No messages yet — say hi!</div>
    </div>`;
  }
  let lastUserId = "";
  let lastTs = 0;
  const rows = messages.map((m) => {
    const sameAuthor = m.user_id === lastUserId && (m.created_at - lastTs) < 5 * 60 * 1000;
    const mine = m.user_id === userId;
    lastUserId = m.user_id;
    lastTs = m.created_at;
    return html`<div class=${"dc-msg " + (mine ? "mine " : "") + (sameAuthor ? "" : "first")} key=${m.id} data-id=${m.id}>
      ${!sameAuthor && html`<div class="dc-msg-meta">
        <span class="author">${m.user_name || "user"}</span>
        <span class="time">${fmtTime(m.created_at)}</span>
      </div>`}
      <div class="dc-msg-body">${m.body}</div>
      <${Reactions} message=${m} canDelete=${(mine || isOwner) && canParticipate}
        canReact=${canParticipate}
        onToggle=${onToggle} onAddReact=${onAddReact} onDelete=${onDelete} />
    </div>`;
  });
  return html`<div class="dc-messages" id="dc-messages" ref=${ref}>${rows}</div>`;
}

function Composer({ onSend }) {
  const [val, setVal] = useState("");
  const ref = useRef(null);
  const autosize = () => {
    const t = ref.current;
    if (!t) return;
    t.style.height = "auto";
    t.style.height = Math.min(t.scrollHeight, 96) + "px";
  };
  const submit = () => {
    const body = val.trim();
    if (!body || !ref.current.reportValidity()) return;
    setVal("");
    setTimeout(autosize, 0);
    onSend(body);
  };
  // A page has no form submit: the button's click and Enter send.
  return html`<div class="dc-composer" data-form>
    <textarea ref=${ref} rows="1" placeholder="Write a message..." maxlength="4000" autocomplete="off"
      value=${val}
      onInput=${(e) => { setVal(e.target.value); autosize(); }}
      onKeyDown=${(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } }} />
    <button type="button" class="dc-send" title="Send" disabled=${!val.trim()} onClick=${submit}>
      <i class="ph-light ph-paper-plane-tilt"></i>
    </button>
  </div>`;
}

function App() {
  const [state, setState] = useState(opened);
  const [toast, setToast] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [picker, setPicker] = useState(null); // { messageId, rect }

  const load = () => api("GET", "/state").then(setState);

  // The worker says what changed and never what it holds: read it again, as whoever this is.
  useFramePush((d) => { if (d.discussion_channel) load().catch(() => {}); });

  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 2000);
    return () => clearTimeout(id);
  }, [toast]);

  const { prefs, messages, can_edit_settings: canEditSettings } = state;
  const canParticipate = !!state.can_participate;
  const icons = (state.reaction_icons && state.reaction_icons.length) ? state.reaction_icons : DEFAULT_REACTION_ICONS;

  const fail = (label) => (err) => setToast(err.message || (label + " failed"));
  const write = (path, body, label) => api("POST", path, body).then(load).catch(fail(label));
  const sendMessage = (body) => write("/send", { body }, "send");
  const toggleReact = (mid, icon) => write("/react", { message_id: mid, icon }, "react");
  const deleteMessage = (id) => write("/delete", { id }, "delete");
  const saveSettings = (patch) => write("/settings", patch, "save");

  return html`<${Fragment}>
    <div class="dc-topline">
      <${Editable} class="dc-title-input" maxlength="80" placeholder="Discussion"
        disabled=${!canEditSettings}
        value=${prefs.title}
        onSave=${(v) => saveSettings({ title: v.trim() || "Discussion" })} />
      ${canEditSettings && html`<button class="dc-icon-btn" title="channel settings"
        onClick=${() => setShowSettings(true)}><i class="ph-light ph-dots-three"></i></button>`}
    </div>
    <${MessagesList} messages=${messages}
      canParticipate=${canParticipate}
      onToggle=${toggleReact}
      onAddReact=${(mid, rect) => setPicker({ messageId: mid, rect })}
      onDelete=${deleteMessage} />
    ${canParticipate && html`<${Composer} onSend=${sendMessage} />`}
    ${showSettings && html`<${SettingsOverlay} prefs=${prefs}
      onClose=${() => setShowSettings(false)}
      onSave=${saveSettings} />`}
    ${picker && html`<${ReactionPicker} icons=${icons} anchorRect=${picker.rect}
      onPick=${(icon) => toggleReact(picker.messageId, icon)}
      onClose=${() => setPicker(null)} />`}
    <${Toast} message=${toast} />
  </${Fragment}>`;
}

// Mount: render straight into `#app` so it keeps the .dc-root grid layout, in place of
// the static "loading…" text, which preact's render() would leave beside the app.
const root = document.getElementById("app");
try {
  await window.seamside.ready;
  opened = await api("GET", "/state");
  userId = opened.me.user_id || "";
  isOwner = !!opened.me.is_owner;
  root.textContent = "";
  root.className = "dc-root";
  // Style vars applied directly to #app so :root selectors keep working.
  applyChannel(root, opened.color);
  render(html`<${App}/>`, root);
} catch (e) {
  root.textContent = "failed to load: " + (e.message || String(e));
}
  </script>
</body>
</html>
