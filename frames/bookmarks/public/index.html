<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarks</title>
  <link rel="stylesheet" href="dyn/frame-prefs.css">
  <style>
    :root { --ch: var(--os-c1); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    /* the render root carries the height too, or `main { height: 100% }` resolves
       against an auto-height div and the frame stops driving its own layout */
    html, body, #app { height: 100%; }
    body {
      margin: 0; font-family: var(--os-font-sans); background: var(--os-bg);
      color: var(--os-text); font-size: var(--os-fs-base);
    }
    main {
      height: 100%; max-width: 820px; margin: 0 auto;
      display: flex; flex-direction: column; gap: var(--os-sp-md);
      padding: clamp(var(--os-sp-md), 3vw, var(--os-sp-xl));
    }

    .header { display: flex; align-items: center; gap: var(--os-sp-sm); flex: 0 0 auto; }
    .header > i {
      flex: 0 0 auto; width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 20px; line-height: 1; color: var(--ch);
    }
    .header h1 {
      flex: 1 1 auto; min-width: 0; margin: 0;
      font-size: var(--os-fs-lg); font-weight: var(--os-weight-semibold); line-height: 24px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header .count {
      flex: 0 0 auto; height: 24px; display: inline-flex; align-items: center; font-size: var(--os-fs-2xs);
      font-feature-settings: 'tnum' 1; color: var(--os-text-muted);
    }
    .header .mode {
      flex: 0 0 auto; height: 24px; display: inline-flex; align-items: center;
      font-size: var(--os-fs-2xs); color: var(--os-text-muted); white-space: nowrap;
    }
    .iconbtn {
      flex: 0 0 auto; width: 24px; height: 24px; padding: 0;
      background: none; border: 0; border-radius: var(--os-radius-sm); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--os-text-subtle); font-size: 16px; line-height: 1;
      transition: color 150ms, background 150ms;
    }
    .iconbtn i { font-size: 16px; line-height: 1; color: inherit; width: auto; height: auto; }
    .iconbtn:hover { color: var(--os-text); background: var(--os-bg-subtle); }
    .iconbtn:active { transform: scale(0.92); }
    .iconbtn:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }

    .banner {
      display: flex; align-items: center; gap: var(--os-sp-xs);
      background: var(--os-bg-inset); border-radius: var(--os-radius-md);
      padding: var(--os-sp-sm) var(--os-sp-md); font-size: var(--os-fs-sm);
      color: var(--os-text-secondary); flex: 0 0 auto;
    }

    /* ---- search is the real interface -------------------------------------------------
       A link you can't find again is the same as one you never saved, so the search box
       gets the weight an add-field would get in another frame. */
    .search {
      display: flex; align-items: center; flex: 0 0 auto;
      background: var(--os-bg-inset); border: 0; border-radius: var(--os-radius-md);
      padding: 2px var(--os-sp-sm); transition: background 150ms, box-shadow 150ms;
    }
    .search:focus-within { background: var(--os-bg-surface); box-shadow: inset 0 0 0 1px var(--os-border-color); }
    .search > i { color: var(--os-text-subtle); font-size: 15px; line-height: 1; flex: 0 0 auto; }
    .search input {
      flex: 1 1 auto; min-width: 0; border: 0; background: transparent; box-shadow: none;
      font: inherit; font-size: var(--os-fs-sm); color: var(--os-text); padding: 8px var(--os-sp-sm);
    }
    .search input:focus { outline: none; background: transparent; box-shadow: none; }
    .search .clear {
      flex: 0 0 auto; background: none; border: 0; cursor: pointer; padding: 2px;
      color: var(--os-text-subtle); font-size: 14px; line-height: 1;
    }
    .search .clear:hover { color: var(--os-text); }

    .tagbar { display: flex; align-items: center; gap: var(--os-sp-xs); flex-wrap: wrap; flex: 0 0 auto; }
    button.tag {
      font: inherit; font-size: var(--os-fs-2xs); cursor: pointer;
      background: var(--os-bg-inset); color: var(--os-text-muted); border: 0;
      border-radius: var(--os-radius-full); padding: 2px var(--os-sp-sm); white-space: nowrap;
      transition: color 150ms, background 150ms, box-shadow 150ms;
    }
    button.tag:hover:not(.active) { color: var(--os-text); background: var(--os-bg-surface); box-shadow: inset 0 0 0 1px var(--os-border-color-subtle); }
    button.tag.active { background: var(--ch); color: var(--ch-fg, var(--os-c1-fg)); }
    button.tag:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }

    /* ---- the list ------------------------------------------------------------------- */
    .list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .row {
      display: flex; align-items: baseline; gap: var(--os-sp-sm); min-width: 0;
      padding: var(--os-sp-sm) var(--os-sp-xs); border-radius: var(--os-radius-sm);
      transition: background 150ms;
    }
    .row + .row { border-top: 1px solid var(--os-border-color-subtle); }
    .row:hover { background: var(--os-bg-subtle); }
    /* THE ONE FUN MOMENT: a paste has no visible target, so the row it produced says
       "it went here" — a channel wash that fades out rather than a toast that covers
       the thing you just saved. */
    .row.landed { animation: landed 1100ms var(--os-ease-out); }
    @keyframes landed {
      0%   { background: color-mix(in srgb, var(--ch), transparent 55%); }
      100% { background: transparent; }
    }
    @media (prefers-reduced-motion: reduce) { .row.landed { animation: none; } }

    /* the site's own colour, derived from its name so the same site always looks the same */
    .dom {
      flex: 0 0 auto; font-size: var(--os-fs-2xs); white-space: nowrap;
      background: color-mix(in srgb, var(--dc), transparent 86%);
      color: color-mix(in srgb, var(--dc), var(--os-text) 30%);
      border-radius: var(--os-radius-full); padding: 1px var(--os-sp-sm);
    }
    .r-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .r-title {
      background: none; border: 0; padding: 0; font: inherit; text-align: left; cursor: pointer;
      font-size: var(--os-fs-sm); color: var(--os-text); min-width: 0; overflow-wrap: anywhere;
    }
    .r-title:hover { color: var(--ch); text-decoration: underline; text-underline-offset: 2px; }
    .r-title:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }
    .r-sub { display: flex; align-items: center; gap: var(--os-sp-xs); flex-wrap: wrap; min-width: 0; }
    .r-note { font-size: var(--os-fs-2xs); color: var(--os-text-muted); overflow-wrap: anywhere; }
    .chip {
      font-size: var(--os-fs-2xs); color: var(--os-text-muted);
      background: var(--os-bg-inset); border-radius: var(--os-radius-full); padding: 0 var(--os-sp-sm);
    }
    .r-acts { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 150ms; }
    .row:hover .r-acts, .r-acts:focus-within { opacity: 1; }
    .read-only .r-acts { display: none; }
    .iconbtn.danger:hover { color: var(--os-cError); }
    .iconbtn.armed { color: var(--os-cError); background: var(--os-cError-muted); opacity: 1; }

    .hint {
      flex: 0 0 auto; font-size: var(--os-fs-2xs); color: var(--os-text-muted);
      display: flex; align-items: center; gap: var(--os-sp-xs);
    }
    .hint code {
      font-family: var(--os-font-mono); font-size: 10px;
      background: var(--os-bg-inset); border-radius: var(--os-radius-sm); padding: 1px 4px;
    }
    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--os-sp-sm); text-align: center; color: var(--os-text-muted); font-size: var(--os-fs-sm);
    }
    .empty i { font-size: 28px; color: var(--os-text-subtle); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { frame, html, render, useState, useEffect, useRef, useFramePush, applyChannel } from "./lib/js/framelib.js";

    // Same site, same colour, on every device — derived from the name, never handed out in
    // arrival order.
    function channelFor(name) {
      let h = 0;
      for (const c of String(name)) h = (h * 31 + c.codePointAt(0)) >>> 0;
      return "var(--os-c" + (h % 12 + 1) + ")";
    }
    const looksUrl = (s) => /^(https?:\/\/|www\.)\S+$/i.test(String(s).trim()) ||
                            /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(String(s).trim());
    const when = (ms) => {
      const d = Math.floor((Date.now() - ms) / 86400000);
      if (d < 1) return "today";
      if (d === 1) return "yesterday";
      if (d < 30) return d + "d";
      return new Date(ms).toLocaleDateString(undefined, { month: "short", year: "numeric" });
    };

    function App() {
      const [me, setMe]     = useState(null);
      const [rows, setRows] = useState(null);
      const [q, setQ]       = useState("");
      const [tag, setTag]   = useState(null);
      const [armed, setArmed] = useState(null);
      const [landed, setLanded] = useState(null);
      const armTimer = useRef(null);

      async function refresh() {
        const r = await frame.api("api/list").catch(() => null);
        if (r && r.bookmarks) setRows(r.bookmarks);
      }
      const write = (path, body) => {
        if (typeof frame.busSend === "function") {
          frame.busSend({ op: path.replace(/^api\//, ""), ...(body || {}) });
          return Promise.resolve({});
        }
        return frame.api(path, body);
      };
      useEffect(() => {
        frame.api("api/whoami").then((m) => {
          if (m && m.space_color) applyChannel(document.documentElement, m.space_color);
          setMe(m);
        }).catch(() => setMe({}));
        refresh();
      }, []);
      useFramePush({ bookmarks_changed: refresh });

      const isEditor = !!(me && me.is_sfi_editor);

      // Paste anywhere to save. Saving stays on HTTP here because the reply is what tells
      // us whether it was a duplicate and which row to flash.
      async function save(url) {
        const r = await frame.api("api/bookmark", { url }).catch(() => null);
        if (!r || !r.ok) {
          await frame.alert((r && r.error) || "That didn't look like a web address.", { title: "Not saved" });
          return;
        }
        await refresh();
        if (r.id) {
          setLanded(r.id);
          setTimeout(() => setLanded(null), 1200);
        }
        if (r.duplicate) setQ("");   // it was already here — clear the filter so it's visible
      }

      // The handler lives on the document so a paste lands wherever the pointer is, but it
      // must not steal a paste aimed at a field the user is actually typing in.
      useEffect(() => {
        if (!isEditor) return;
        const onPaste = (e) => {
          const el = document.activeElement;
          if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
          const text = (e.clipboardData || window.clipboardData)?.getData("text") ?? "";
          if (!looksUrl(text)) return;
          e.preventDefault();
          save(text.trim());
        };
        document.addEventListener("paste", onPaste);
        return () => document.removeEventListener("paste", onPaste);
      }, [isEditor]);

      if (!me || rows === null) return html`<div></div>`;

      async function addByHand() {
        const url = await frame.prompt("Paste or type a web address.", { title: "Save a link", okLabel: "Save" });
        if (url && url.trim()) save(url.trim());
      }
      async function editRow(b) {
        const what = await frame.choose(b.title, {
          title: "Link",
          options: [
            { id: "rename", label: "Rename", icon: "ph-pencil-simple", detail: b.title },
            { id: "tags", label: "Tags", icon: "ph-tag", detail: b.tags.length ? b.tags.join(", ") : "none" },
            { id: "note", label: "Note", icon: "ph-note", detail: b.note || "none" },
            { id: "copy", label: "Show the address", icon: "ph-link", detail: b.domain },
          ],
        });
        if (what === "rename") {
          const v = await frame.prompt("Title", { title: "Rename", defaultValue: b.title, okLabel: "Save" });
          if (v && v.trim()) write("api/bookmark/" + b.id, { title: v.trim() });
        } else if (what === "tags") {
          const v = await frame.prompt("Separate tags with spaces or commas.", { title: "Tags", defaultValue: b.tags.join(" "), okLabel: "Save" });
          if (v !== null) write("api/bookmark/" + b.id, { tags: v });
        } else if (what === "note") {
          const v = await frame.prompt("A line about why you saved it.", { title: "Note", defaultValue: b.note, okLabel: "Save" });
          if (v !== null) write("api/bookmark/" + b.id, { note: v });
        } else if (what === "copy") {
          await frame.alert(b.url, { title: b.domain });
        }
      }
      function trash(b) {
        if (armed !== b.id) {
          setArmed(b.id);
          if (armTimer.current) clearTimeout(armTimer.current);
          armTimer.current = setTimeout(() => setArmed(null), 2500);
          return;
        }
        setArmed(null);
        if (armTimer.current) clearTimeout(armTimer.current);
        setRows((xs) => xs && xs.filter((x) => x.id !== b.id));
        write("api/bookmark/" + b.id + "/delete", {}).catch(() => {});
      }
      function open(b) {
        if (typeof frame.openExternalUrl === "function") frame.openExternalUrl(b.url);
        else frame.alert(b.url, { title: b.domain });
      }

      const allTags = [...new Set(rows.flatMap((b) => b.tags))].sort();
      const active = tag && allTags.includes(tag) ? tag : null;
      const needle = q.trim().toLowerCase();
      const shown = rows.filter((b) => {
        if (active && !b.tags.includes(active)) return false;
        if (!needle) return true;
        return (b.title + " " + b.url + " " + b.domain + " " + b.note + " " + b.tags.join(" "))
          .toLowerCase().includes(needle);
      });
      const mode = me.is_owner ? "owner" : isEditor ? "editor" : "viewer";

      return html`
        <main class=${isEditor ? "" : "read-only"}>
          <div class="header">
            <i class="ph-light ph-bookmark-simple"></i>
            <h1>Bookmarks</h1>
            <span class="count">${rows.length}</span>
            <span class="mode">${mode}</span>
            ${isEditor ? html`
              <button class="iconbtn" title="Save a link" onClick=${addByHand}>
                <i class="ph-light ph-plus"></i>
              </button>` : null}
          </div>

          ${!isEditor ? html`
            <div class="banner">
              <i class="ph-light ph-eye"></i>
              <span>${me.is_anon ? "You are browsing these links." : "You can follow these links but not change them."}</span>
            </div>` : null}

          ${rows.length ? html`
            <div class="search">
              <i class="ph-light ph-magnifying-glass"></i>
              <input type="search" placeholder="Search everything…" value=${q}
                onInput=${(e) => setQ(e.target.value)} />
              ${q ? html`<button class="clear" title="Clear" onClick=${() => setQ("")}>
                <i class="ph-light ph-x"></i></button>` : null}
            </div>` : null}

          ${allTags.length ? html`
            <div class="tagbar">
              ${allTags.map((t) => html`
                <button class=${"tag" + (active === t ? " active" : "")} key=${t}
                  onClick=${() => setTag(active === t ? null : t)}>${t}</button>`)}
            </div>` : null}

          ${rows.length === 0
            ? html`
              <div class="empty">
                <i class="ph-light ph-bookmark-simple"></i>
                <span>${isEditor ? "No links yet — paste one anywhere in this frame." : "Nothing here yet."}</span>
              </div>`
            : shown.length === 0
              ? html`<div class="empty"><span>Nothing matches.</span></div>`
              : html`
                <div class="list">
                  ${shown.map((b) => html`
                    <div class=${"row" + (landed === b.id ? " landed" : "")} key=${b.id}>
                      <span class="dom" style=${"--dc: " + channelFor(b.domain)}>${b.domain}</span>
                      <div class="r-main">
                        <button class="r-title" onClick=${() => open(b)}>${b.title}</button>
                        ${b.note ? html`<span class="r-note">${b.note}</span>` : null}
                        <div class="r-sub">
                          ${b.tags.map((t) => html`<span class="chip" key=${t}>${t}</span>`)}
                          <span class="chip">${when(b.added_ms)}</span>
                        </div>
                      </div>
                      ${isEditor ? html`
                        <span class="r-acts">
                          <button class="iconbtn" title="Edit" onClick=${() => editRow(b)}>
                            <i class="ph-light ph-pencil-simple"></i>
                          </button>
                          <button class=${"iconbtn danger" + (armed === b.id ? " armed" : "")}
                            title=${armed === b.id ? "Press again to remove" : "Remove"}
                            onClick=${() => trash(b)} onBlur=${() => setArmed(null)}>
                            <i class=${"ph-light " + (armed === b.id ? "ph-trash" : "ph-trash-simple")}></i>
                          </button>
                        </span>` : null}
                    </div>
                  `)}
                </div>`}

          ${isEditor && rows.length ? html`
            <div class="hint">
              <i class="ph-light ph-clipboard-text"></i>
              <span>paste a link anywhere here to save it</span>
            </div>` : null}
        </main>`;
    }

    render(html`<${App} />`, document.getElementById("app"));
  </script>
</body>
</html>
