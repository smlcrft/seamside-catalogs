<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CamJam</title>
  <link rel="stylesheet" href="dyn/frame-prefs.css">
  <style>
    /* Patterns here are the canonical ones from the _patterns reference frame:
       the 24px header rail, the three button affordances, the field shape,
       and the ink plate as the frame's single contrast moment — which a
       camera image wants anyway. The one deliberate delight is the breathing
       live dot; nothing else on the screen moves. */
    :root { --ch: var(--os-c1); --ch-fg: var(--os-c1-fg); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: var(--os-font-sans); background: var(--os-bg);
      color: var(--os-text); font-size: var(--os-fs-base);
    }
    main {
      max-width: 520px; margin: 0 auto; min-height: 100%;
      padding: clamp(var(--os-sp-md), 3.5vw, var(--os-sp-xl));
      display: flex; flex-direction: column; gap: var(--os-sp-lg);
    }

    /* --- header: 24px first-line rail (icon / title / mode / gear share a center) --- */
    .fh { display: flex; align-items: flex-start; gap: var(--os-sp-sm); }
    .fh > i.fh-brand {
      font-size: 22px; line-height: 1; color: var(--ch);
      height: 24px; display: flex; align-items: center;
    }
    .fh .fh-titles { flex: 1; min-width: 0; }
    /* The title edits IN PLACE — no title field in the settings sheet. Two-class
       specificity so it beats the frame-prefs `input` baseline (which would give it a
       box, a background, and a border). line-height 24px keeps it on the header rail
       whether it renders as an input or, for a non-member, a disabled one. */
    .fh input.fh-title {
      display: block; width: 100%; height: 24px;
      margin: 0 0 0 calc(-1 * var(--os-sp-xs)); padding: 0 var(--os-sp-xs);
      font-size: var(--os-fs-lg); font-weight: var(--os-weight-semibold); line-height: 24px;
      color: var(--os-text); background: transparent;
      border: 1px solid transparent; border-radius: var(--os-radius-sm);
      transition: background var(--os-transition-fast), border-color var(--os-transition-fast);
    }
    .fh input.fh-title:hover:not(:disabled) { background: var(--os-bg-subtle); }
    .fh input.fh-title:focus {
      outline: none; background: var(--os-bg-surface);
      border-color: var(--os-border-color); box-shadow: none;
    }
    /* A non-member sees the title as text, not as a greyed-out control. */
    .fh input.fh-title:disabled { color: var(--os-text); cursor: default; opacity: 1; }
    .fh .fh-mode {
      font-size: var(--os-fs-2xs); color: var(--os-text-muted);
      text-transform: lowercase; letter-spacing: 0.02em; white-space: nowrap;
      height: 24px; display: flex; align-items: center;
    }
    .fh .fh-gear {
      background: none; border: 0; cursor: pointer; color: var(--os-text-muted);
      width: 28px; height: 28px; margin: -2px 0; padding: 0;
      border-radius: var(--os-radius-sm); font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: color 150ms, background 150ms;
    }
    .fh .fh-gear:hover { color: var(--ch); background: var(--os-bg-subtle); }
    .fh .fh-gear:active { transform: scale(0.92); }

    /* --- the stage: the frame's one ink plate, image over a caption row --- */
    .stage {
      background: var(--os-text); border-radius: var(--os-radius-lg); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .stage-view {
      aspect-ratio: 4 / 3; min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* The still is 160px wide by design — it fills the plate rather than sitting in
       it at native size. `cover` crops the overflowing axis when the camera's aspect
       doesn't match the plate's, so the image always reaches every edge.
       `image-rendering: auto` is the browser's own bilinear upscale: free, GPU-side,
       and the reason a 160px still reads as soft rather than blocky. Never
       `pixelated` here, and never a CSS blur filter — that would cost real frames. */
    .stage-view img {
      width: 100%; height: 100%; display: block;
      object-fit: cover; image-rendering: auto;
    }
    .stage-idle {
      display: flex; flex-direction: column; align-items: center; gap: var(--os-sp-sm);
      padding: var(--os-sp-xl); text-align: center;
      color: color-mix(in srgb, var(--os-bg) 58%, transparent);
    }
    .stage-idle i { font-size: 28px; line-height: 1; }
    .stage-idle span { font-size: var(--os-fs-sm); line-height: 1.4; max-width: 32ch; }

    .cap {
      display: flex; align-items: center; gap: 6px;
      padding: var(--os-sp-sm) var(--os-sp-md);
      font-size: var(--os-fs-2xs); font-feature-settings: 'tnum' 1;
      color: color-mix(in srgb, var(--os-bg) 82%, transparent);
      min-width: 0;
    }
    .cap .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cap .sep { color: color-mix(in srgb, var(--os-bg) 35%, transparent); }
    .cap .when { margin-left: auto; white-space: nowrap; color: color-mix(in srgb, var(--os-bg) 64%, transparent); }
    /* The cadence denominator: how old the still is, over how often one is due. Same
       size, dimmer — the age is the live figure and the rate is the constant it's read
       against, so lightness carries the difference rather than a second size. A hair
       gap (not a word gap) so the pair reads as one compound readout. The row's tnum
       keeps the slash from sliding sideways as the seconds tick. */
    .cap .every { margin-left: 4px; color: color-mix(in srgb, var(--os-bg) 45%, transparent); }
    /* Binary status: filled = a still arrived within the interval, stroke = the
       feed went quiet. The breathe is the screen's single moment of life. */
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .cap .dot {
      width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
      background: var(--os-cSuccess); animation: breathe 3s ease-in-out infinite;
    }
    .cap .dot.quiet { background: transparent; border: 1.5px solid currentColor; animation: none; }
    @media (prefers-reduced-motion: reduce) { .cap .dot { animation: none; } }

    /* --- control bar --- */
    .bar { display: flex; align-items: center; gap: var(--os-sp-sm); flex-wrap: wrap; }
    .bar select { flex: 1 1 160px; width: auto; min-width: 0; }
    .bar .note { font-size: var(--os-fs-2xs); color: var(--os-text-muted); line-height: 1.4; }
    .bar .note.bad { color: var(--os-cError); }

    .btn-primary {
      background: var(--ch); color: var(--ch-fg); border: 0; cursor: pointer;
      padding: var(--os-sp-sm) var(--os-sp-lg); border-radius: var(--os-radius-md);
      font: inherit; font-size: var(--os-fs-sm); font-weight: var(--os-weight-medium);
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      transition: filter 150ms, transform 80ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary {
      background: var(--os-bg-surface); color: var(--os-text); cursor: pointer;
      border: 1px solid var(--os-border-color); border-radius: var(--os-radius-md);
      padding: 8px 12px; font: inherit; font-size: var(--os-fs-sm); white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
      transition: border-color 150ms, box-shadow 40ms ease, background 40ms ease, padding 40ms ease;
    }
    .btn-secondary:hover { border-color: var(--os-text-subtle); }
    .btn-secondary:active {
      padding: 9px 12px 7px;                 /* total stays constant; label drops 1px */
      background: var(--os-bg-inset);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.07);
    }

    /* --- settings sheet --- */
    .field { display: flex; flex-direction: column; gap: var(--os-sp-xs); }
    .field > label {
      font-size: 11px; font-weight: var(--os-weight-semibold); text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--os-text-muted);
    }
    .field .hint { font-size: var(--os-fs-2xs); color: var(--os-text-muted); line-height: 1.4; }
    .sheet { display: flex; flex-direction: column; gap: var(--os-sp-md); }
    /* Context, not a control — the hairline above it is what says so. Without the rule
       it reads as a third setting the owner can't find the switch for. */
    .sheet-note {
      margin: 0; padding-top: var(--os-sp-md);
      border-top: 1px solid var(--os-border-color-subtle);
      font-size: var(--os-fs-2xs); color: var(--os-text-muted); line-height: 1.4;
    }

    /* The capture source never renders — the sharer watches the same fanned-out
       still everyone else sees, so the preview is honest about what it sends. */
    video.cap-src { display: none; }
  </style>
</head>
<body>
  <script type="module">
    import {
      frame, html, render, useState, useEffect, useRef,
      Editable, Modal, useFramePush, applyChannel,
    } from "./lib/js/framelib.js";

    const JPEG_QUALITY = 0.6;
    // "signal lost" has to trail the cadence, not a fixed number, or a slow rung would
    // read as broken between every still. Kept under the host's own eviction window so
    // the caption goes quiet just before the slot actually frees.
    const quietMs = (ms) => Math.max(9000, ms * 2.5);
    // 500 → "0.5s", 60000 → "60s". Trailing zeros are noise on a cadence label.
    const secs = (ms) => (ms / 1000) + "s";

    function ago(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      if (s < 2) return "just now";
      if (s < 60) return s + "s ago";
      return Math.floor(s / 60) + "m ago";
    }

    function App() {
      const [st, setSt]         = useState(null);   // /api/state payload
      const [anchor, setAnchor] = useState(0);      // local clock when `st` arrived
      const [sharing, setSharing] = useState(false);
      const [cams, setCams]     = useState([]);
      const [camId, setCamId]   = useState("");
      const [err, setErr]       = useState("");
      const [blocked, setBlocked] = useState(false);   // camera denied, and recoverable
      const [sheet, setSheet]   = useState(false);
      const [, setBeat]         = useState(0);      // 1s repaint so the caption age ticks

      const videoRef  = useRef(null);
      const streamRef = useRef(null);
      const sharingRef = useRef(false);
      const claimedAtRef = useRef(0);
      sharingRef.current = sharing;

      // ---- camera ----------------------------------------------------------------
      function dropStream() {
        const s = streamRef.current;
        if (s) s.getTracks().forEach((t) => t.stop());
        streamRef.current = null;
      }

      // Device LABELS only exist once a camera has been granted, so the picker is
      // populated after the first successful open rather than before it.
      //
      // Capture at the top of the ladder regardless of the current rung, and downscale
      // per still. Requesting the RUNG's width instead would cap the source: a 320px
      // capture feeding the 1280px rung upscales, spending every one of those bytes on
      // blur. `ideal` is a preference, not a constraint, so a camera that can't do 1920
      // simply gives its best mode and nothing fails. One stream for every rung also
      // means moving the ladder mid-feed never has to reopen the camera.
      async function openCam(deviceId) {
        dropStream();
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: deviceId
            ? { deviceId: { exact: deviceId }, width: { ideal: 1920 } }
            : { width: { ideal: 1920 } },
        });
        streamRef.current = stream;
        const v = videoRef.current;
        v.srcObject = stream;
        await v.play().catch(() => {});
        // play() can resolve before the track reports its dimensions; without this the
        // first capture is skipped and the feed sits on "warming up" for a whole interval.
        if (!v.videoWidth) {
          await new Promise((done) => v.addEventListener("loadedmetadata", done, { once: true }));
        }
        const devs = await navigator.mediaDevices.enumerateDevices().catch(() => []);
        setCams(devs.filter((d) => d.kind === "videoinput"));
        const track = stream.getVideoTracks()[0];
        setCamId((track && track.getSettings && track.getSettings().deviceId) || deviceId || "");
      }

      // Blocked is the one failure with a recovery path (frame.requestMediaAccess), so it
      // gets told apart from "no camera" and "camera busy" — those want a different
      // action, or none.
      const isBlocked = (e) => ["NotAllowedError", "SecurityError"].includes((e && e.name) || "");

      function camError(e) {
        switch ((e && e.name) || "") {
          case "NotAllowedError":
          case "SecurityError":
            return "Camera access is blocked for this frame on this device. Either this frame's camera request was declined, or Seamside doesn't have camera permission in your system settings.";
          case "NotFoundError":
          case "OverconstrainedError":
            return "No camera found on this device.";
          case "NotReadableError":
            return "The camera is busy in another app.";
          default:
            return "Couldn't open a camera.";
        }
      }

      async function startShare() {
        setErr(""); setBlocked(false);
        try {
          await openCam("");
        } catch (e) {
          setErr(camError(e));
          setBlocked(isBlocked(e));
          return;
        }
        claimedAtRef.current = Date.now();
        frame.busSend({ op: "claim" });   // claims the slot, taking over an active feed
        setSharing(true);
      }

      function stopShare(tellHost) {
        dropStream();
        setSharing(false);
        setCams([]);
        setCamId("");
        if (tellHost) frame.busSend({ op: "stop" });
      }

      async function switchCam(deviceId) {
        setCamId(deviceId);
        try { setErr(""); await openCam(deviceId); }
        catch (e) { setErr(camError(e)); setBlocked(isBlocked(e)); }
      }

      // Grab one still at the rung's width and send it up the tether. Fire-and-forget:
      // it comes back down as a cam_tick like everyone else's. The width comes from the
      // host (`still_w`), never derived here, so the two ends can't disagree about the
      // rung and get stills bounced for exceeding its size cap.
      function sendStill(targetW) {
        const v = videoRef.current;
        if (!v || !v.videoWidth) return;
        // Never upscale past what the camera actually gave us: a 720p webcam on the
        // 1920px rung should send 1280px of real detail, not 1920px of interpolation.
        const w = Math.min(targetW, v.videoWidth);
        const h = Math.max(1, Math.round((w * v.videoHeight) / v.videoWidth));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        const url = c.toDataURL("image/jpeg", JPEG_QUALITY);
        frame.busSend({ op: "f", jpeg: url.slice(url.indexOf(",") + 1) });
      }

      // ---- state -----------------------------------------------------------------
      async function refresh() {
        const r = await frame.api("api/state").catch(() => null);
        if (!r) return;
        setSt(r);
        setAnchor(Date.now());
        applyChannel(document.body, r.space_color);
        // Someone took the slot (or the owner cut the feed) — shut our camera off. The
        // grace window matters: a read already in flight when we claimed still describes
        // the previous holder, and acting on it would stop us the instant we started.
        const settled = Date.now() - claimedAtRef.current > 4000;
        if (settled && sharingRef.current && (!r.live || !r.live.is_me)) stopShare(false);
      }

      useEffect(() => { refresh(); return () => dropStream(); }, []);
      useFramePush({ cam_tick: refresh });

      // Capture loop — restarts cleanly when the owner moves to another rung. Interval
      // and width always change together, so both are deps.
      const intervalMs = (st && st.interval_ms) || 2000;
      const stillW = (st && st.still_w) || 160;
      useEffect(() => {
        if (!sharing) return;
        const shoot = () => sendStill(stillW);
        shoot();
        const id = setInterval(shoot, intervalMs);
        return () => clearInterval(id);
      }, [sharing, intervalMs, stillW]);

      // Keep the caption's age honest between pushes.
      useEffect(() => {
        const id = setInterval(() => setBeat((n) => n + 1), 1000);
        return () => clearInterval(id);
      }, []);

      if (!st) return html`<main></main>`;

      const live = st.live;
      const ageMs = live ? live.age_ms + (Date.now() - anchor) : 0;
      const quiet = live ? ageMs > quietMs(intervalMs) : false;
      const mode = st.is_owner ? "owner" : st.is_sfi_member ? "member" : "visitor";

      return html`
        <main>
          <div class="fh">
            <i class="ph-light ph-video-camera fh-brand"></i>
            <div class="fh-titles">
              ${/* Editable, not a plain input: this frame refreshes state on every tick,
                   which would clobber a half-typed name. Editable's local buffer owns the
                   value while focused and re-syncs when it isn't. Enter commits by
                   blurring; blur is what saves. */ ""}
              <${Editable} class="fh-title" tag="input" value=${st.title}
                disabled=${!st.can_share} maxlength="80" aria-label="Frame title"
                onSave=${(v) => frame.busSend({ op: "title", title: v })}
                onKeyDown=${(e) => { if (e.key === "Enter") e.target.blur(); }} />
            </div>
            <span class="fh-mode">${mode}</span>
            ${st.is_owner ? html`
              <button class="fh-gear" title="Settings" onClick=${() => setSheet(true)}>
                <i class="ph-light ph-gear-six"></i>
              </button>` : null}
          </div>

          <div class="stage">
            <div class="stage-view">
              ${live && live.jpeg
                ? html`<img src=${"data:image/jpeg;base64," + live.jpeg} alt="Shared camera" />`
                : html`
                  <div class="stage-idle">
                    <i class="ph-light ph-video-camera-slash"></i>
                    <span>${
                      live
                        ? "Warming up the camera…"
                        : st.can_share
                          ? "Nobody is sharing. Start a feed whenever you like."
                          : "Nobody is sharing right now."
                    }</span>
                  </div>`}
            </div>
            ${live ? html`
              <div class="cap">
                <span class=${"dot" + (quiet ? " quiet" : "")}></span>
                <span class="who">${live.is_me ? "you" : live.user_name}</span>
                <span class="sep">·</span>
                ${/* no whitespace between these two: the gap is the .every margin */ ""}
                <span class="when">${quiet ? "signal lost" : ago(ageMs)}<span class="every">/${secs(intervalMs)}</span></span>
              </div>` : null}
          </div>

          ${st.can_share ? html`
            <div class="bar">
              ${sharing
                ? html`
                  <button class="btn-secondary" onClick=${() => stopShare(true)}>
                    <i class="ph-light ph-stop-circle"></i>stop sharing
                  </button>
                  ${cams.length > 1 ? html`
                    <select title="Camera" value=${camId}
                      onChange=${(e) => switchCam(e.target.value)}>
                      ${cams.map((d, i) => html`
                        <option key=${d.deviceId} value=${d.deviceId}>
                          ${d.label || "Camera " + (i + 1)}
                        </option>`)}
                    </select>` : null}`
                : html`
                  <button class="btn-primary" onClick=${startShare}>
                    <i class="ph-light ph-video-camera"></i>
                    ${live ? "share instead" : "share my camera"}
                  </button>
                  ${live && !live.is_me
                    ? html`<span class="note">${live.user_name} is sharing. This takes over.</span>`
                    : html`<span class="note">A ${stillW}px still, every ${secs(intervalMs)}. No audio.</span>`}`}
              ${err ? html`<span class="note bad">${err}</span>` : null}
              ${/* The way back from "not now". The host forgets this placement's
                   remembered answer and reloads the frame, so the consent prompt runs
                   again — meaning this click tears down the current document, by design.
                   Feature-detected: framelib is served by the VIEWING device, so an
                   older viewer build simply doesn't offer the button. */ ""}
              ${blocked && typeof frame.requestMediaAccess === "function" ? html`
                <button class="btn-secondary" onClick=${() => frame.requestMediaAccess()}>
                  <i class="ph-light ph-lock-key-open"></i>ask me again
                </button>` : null}
            </div>` : null}

          <video class="cap-src" ref=${videoRef} muted playsinline autoplay></video>

          ${sheet ? html`
            <${Modal} title="CamJam settings" onClose=${() => setSheet(false)}
              actions=${html`<button class="btn-secondary" onClick=${() => setSheet(false)}>Done</button>`}>
              <div class="sheet">
                <div class="field">
                  <label>Cadence and detail</label>
                  <select value=${String(intervalMs)}
                    onChange=${(e) => frame.busSend({ op: "settings", interval_ms: Number(e.target.value) })}>
                    ${(st.steps || []).map((s) => html`
                      <option key=${s.ms} value=${String(s.ms)}>
                        every ${secs(s.ms)} · ${s.w}px wide
                      </option>`)}
                  </select>
                  <span class="hint">Faster steps trade detail for smoothness; bandwidth stays low either way.</span>
                </div>
                ${/* Not a control: wayfinding. An owner opens settings looking for "who
                     can see this", and the answer lives in the frame's own share key. */ ""}
                <p class="sheet-note">Who can watch is set by the frame's sharing setting.
                  Only members can start a feed.</p>
              </div>
            <//>` : null}
        </main>`;
    }

    render(html`<${App} />`, document.body);
  </script>
</body>
</html>
