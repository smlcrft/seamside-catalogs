<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chore Chart</title>
  <link rel="stylesheet" href="dyn/frame-prefs.css">
  <style>
    :root { --ch: var(--os-c1); }   /* follows the space channel at runtime via applyChannel */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    /* the render root carries the height too, or `main { height: 100% }` resolves
       against an auto-height div and the frame stops driving its own layout */
    html, body, #app { height: 100%; }
    body {
      margin: 0; font-family: var(--os-font-sans); background: var(--os-bg);
      color: var(--os-text); font-size: var(--os-fs-base);
    }
    main {
      height: 100%; max-width: 1120px; margin: 0 auto;
      display: flex; flex-direction: column; gap: var(--os-sp-md);
      padding: clamp(var(--os-sp-md), 3vw, var(--os-sp-xl));
    }

    /* ---- header rail (24px first line; see PRECISION §6) --------------------------- */
    .header { display: flex; align-items: center; gap: var(--os-sp-sm); flex: 0 0 auto; }
    .header i {
      flex: 0 0 auto; width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 20px; line-height: 1; color: var(--ch);
    }
    .header h1 {
      flex: 1 1 auto; min-width: 0; margin: 0;
      font-size: var(--os-fs-lg); font-weight: var(--os-weight-semibold); line-height: 24px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* the rail is frame chrome only: role, then data. One word, three outcomes. */
    .header .mode {
      flex: 0 0 auto; height: 24px; display: inline-flex; align-items: center;
      font-size: var(--os-fs-2xs); color: var(--os-text-muted); white-space: nowrap;
    }
    .drawer {
      flex: 0 0 auto; position: relative;
      width: 24px; height: 24px; padding: 0;
      background: none; border: 0; border-radius: var(--os-radius-sm); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--os-text-subtle); font-size: 16px; line-height: 1;
      transition: color 150ms, background 150ms;
    }
    /* the glyph must outrank the .header i channel-tint rule above */
    .drawer i { font-size: 16px; line-height: 1; color: inherit; width: auto; height: auto; }
    .drawer:hover { color: var(--os-text); background: var(--os-bg-subtle); }
    .drawer:active { transform: scale(0.92); }
    .drawer:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }
    .drawer.pending::after {
      content: ""; position: absolute; top: 0; right: 0;
      width: 5px; height: 5px; border-radius: var(--os-radius-full); background: var(--ch);
      animation: drawer-breathe 2s ease-in-out infinite;
    }
    @keyframes drawer-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .drawer.pending::after { animation: none; } }

    /* how the week is going. Thin channel meter, tnum count. */
    .progress {
      display: flex; align-items: center; gap: var(--os-sp-md); flex: 0 0 auto;
      font-size: var(--os-fs-sm); color: var(--os-text-secondary); font-feature-settings: 'tnum' 1;
      white-space: nowrap;
    }
    .meter { flex: 1; height: 3px; background: var(--os-bg-inset); border-radius: var(--os-radius-full); overflow: hidden; }
    .meter div { height: 100%; background: var(--ch); border-radius: var(--os-radius-full); transition: width var(--os-transition-normal); }

    .banner {
      display: flex; align-items: center; gap: var(--os-sp-xs);
      background: var(--os-bg-inset); border-radius: var(--os-radius-md);
      padding: var(--os-sp-sm) var(--os-sp-md); font-size: var(--os-fs-sm); color: var(--os-text-secondary);
      flex: 0 0 auto;
    }

    /* ---- add strip -------------------------------------------------------------------
       One recessed well: rest = bg-inset, focus-within lifts the WHOLE strip to surface
       with a hairline ring. The fields inside never paint their own boxes. Keeps a row's
       measure so "who" stays beside the chore rather than drifting to the far edge. */
    .add {
      display: flex; align-items: center; flex: 0 0 auto;
      width: 100%; max-width: 560px;
      background: var(--os-bg-inset); border: 0; border-radius: var(--os-radius-md);
      padding: 2px var(--os-sp-xs);
      transition: background 150ms, box-shadow 150ms;
    }
    .add:focus-within { background: var(--os-bg-surface); box-shadow: inset 0 0 0 1px var(--os-border-color); }
    .add > i { color: var(--os-text-subtle); font-size: 14px; line-height: 0; flex: 0 0 auto; margin: 0 var(--os-sp-xs); }
    .add input {
      display: block; border: 0; background: transparent; box-shadow: none; font: inherit;
      font-size: var(--os-fs-sm); color: var(--os-text); padding: 6px var(--os-sp-sm);
      width: 100%; min-width: 0;   /* without this the fields refuse to shrink and the
                                      rhythm switch is pushed out of the strip on a phone */
    }
    .add input:focus { outline: none; background: transparent; box-shadow: none; }
    .add input.f-chore { flex: 1 1 0; width: auto; }
    .add input.f-who { flex: 0 1 110px; width: auto; border-left: 1px solid var(--os-border-color-subtle); }
    /* the rhythm is a 4-position switch, not a dropdown: tap it and it steps to the next
       one. Four values is exactly the range where cycling beats a menu. */
    .cadbtn {
      flex: 0 0 auto; border: 0; border-left: 1px solid var(--os-border-color-subtle);
      background: none; cursor: pointer; font: inherit; font-size: var(--os-fs-sm);
      color: var(--os-text-muted); padding: 6px var(--os-sp-md);
      transition: color 150ms;
    }
    .cadbtn:hover { color: var(--os-text); }
    .cadbtn:active { transform: none; }
    .cadbtn:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }
    .read-only .add { display: none; }

    /* ---- the board: one PUNCH CARD per chore -----------------------------------------
       A chore is not a to-do item, it is a thing you keep up. So the unit is a card you
       punch, the way a coffee card is punched: the run of holes IS the streak, sitting
       there as an object instead of hiding behind the number "3". The person is carried
       as colour + name on the card rather than as a container around it, which keeps the
       card the hero and lets a whole household read as one board. */
    .cards {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      display: grid; align-content: start;
      grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
      gap: var(--os-sp-md); padding: 2px; padding-bottom: var(--os-sp-sm);
    }
    .card {
      display: flex; flex-direction: column; gap: var(--os-sp-sm); min-width: 0;
      background: var(--os-bg-surface); border: 1px solid var(--os-border-color-subtle);
      border-radius: var(--os-radius-md); padding: var(--os-sp-md);
      transition: border-color 150ms, box-shadow 150ms, transform 150ms;
    }
    main:not(.read-only) .card:hover { border-color: var(--os-text-subtle); box-shadow: var(--os-shadow-sm); transform: translateY(-1px); }
    /* a card whose current turn is handled steps back: the ground tints to the person's
       channel just enough to read as settled, and the eye goes to what is still open */
    .card.done { background: color-mix(in srgb, var(--ch), var(--os-bg-surface) 94%); }

    .c-top { display: flex; align-items: center; gap: var(--os-sp-xs); min-width: 0; }
    .who {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--os-sp-xs);
      min-width: 0; background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
    }
    .who:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }
    .read-only .who { cursor: default; }
    /* the badge carries the person's channel; their name sits right beside it, because a
       colour only means something with the word next to it */
    .badge {
      flex: 0 0 20px; width: 20px; height: 20px; border-radius: var(--os-radius-full);
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--ch); color: var(--ch-fg, var(--os-c1-fg));
      font-size: var(--os-fs-2xs); font-weight: var(--os-weight-semibold); text-transform: uppercase;
    }
    .badge i { font-size: 12px; line-height: 0; }
    .who-name {
      min-width: 0; font-size: var(--os-fs-2xs); color: var(--os-text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px;
    }
    /* the rhythm is the card's masthead: mono + tracked uppercase, the way a real card
       prints its terms */
    .rhythm {
      margin-left: auto; flex: 0 0 auto;
      background: none; border: 0; padding: 0; cursor: pointer; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--os-text-muted);
      transition: color 150ms;
    }
    .rhythm:hover { color: var(--os-text); }
    .rhythm:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }
    .read-only .rhythm { cursor: default; }

    .c-name {
      background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left;
      min-width: 0; word-break: break-word; cursor: pointer;
      font-size: var(--os-fs-md); font-weight: var(--os-weight-medium); line-height: 1.25;
    }
    .c-name:hover { text-decoration: underline; text-underline-offset: 3px; }
    .c-name:focus-visible { outline: none; box-shadow: var(--os-focus-ring); border-radius: var(--os-radius-sm); }
    .read-only .c-name { cursor: default; }
    .read-only .c-name:hover { text-decoration: none; }

    /* ---- the punch row --------------------------------------------------------------
       Binary status, one slot per turn: filled = punched, stroked = still to come. The
       LIVE slot is this turn — bigger, ringed in the person's channel, and the only one
       you can press. */
    .punches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .slot {
      flex: 0 0 auto; width: 14px; height: 14px; border-radius: var(--os-radius-full);
      border: 1.5px solid var(--os-border-color); background: none; padding: 0;
    }
    .slot.punched { background: var(--ch); border-color: var(--ch); }
    .slot.live {
      width: 22px; height: 22px; border-width: 2px; border-color: var(--ch); cursor: pointer;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ch), transparent 90%);
      transition: background 150ms, transform 80ms var(--os-ease-spring), box-shadow 150ms;
    }
    main:not(.read-only) .slot.live:hover { background: color-mix(in srgb, var(--ch), transparent 62%); }
    .slot.live:active { transform: scale(0.88); }
    .slot.live:focus-visible { outline: none; box-shadow: var(--os-focus-ring); }
    .read-only .slot.live { cursor: default; box-shadow: none; }
    /* THE ONE FUN MOMENT: the punch lands with a spring overshoot, so keeping a streak
       feels like stamping a card rather than ticking a box. */
    .slot.punched.live { background: var(--ch); animation: punch 280ms var(--os-ease-spring); }
    @keyframes punch {
      0%   { transform: scale(0.55); }
      55%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .slot.punched.live { animation: none; } }

    /* the readout: mono numbers against the sans card, per PRECISION's type pairing */
    .tally {
      margin-left: auto; flex: 0 0 auto; font-size: 11px; color: var(--os-text-muted);
      font-feature-settings: 'tnum' 1; white-space: nowrap;
    }
    .tally b { color: var(--ch); font-weight: var(--os-weight-semibold); }

    .notice {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--os-sp-sm); text-align: center; padding: var(--os-sp-xl); flex: 1;
    }
    .notice i { font-size: 28px; color: var(--os-text-subtle); }
    .notice p { margin: 0; font-size: var(--os-fs-sm); color: var(--os-text-secondary); max-width: 380px; }
    .empty { color: var(--os-text-muted); font-size: var(--os-fs-sm); text-align: center; padding: var(--os-sp-lg); flex: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { frame, html, render, useState, useEffect, useFramePush, applyChannel } from "./lib/js/framelib.js";

    const CADENCES = ["daily", "weekly", "monthly", "once"];
    // How many turns a card holds. The row is the rhythm made visible: a daily card is a
    // week of holes, a weekly card a month and a half, a one-off card is a single slot.
    const SLOTS = { daily: 7, weekly: 6, monthly: 4, once: 1 };

    // A person's colour must be the SAME on every device, so it is derived from the name
    // rather than handed out in arrival order. 12 channels, the platform's own palette.
    function channelFor(name) {
      let h = 0;
      for (const c of String(name)) h = (h * 31 + c.codePointAt(0)) >>> 0;
      return "var(--os-c" + (h % 12 + 1) + ")";
    }
    const initial = (name) => (String(name).trim()[0] || "?");

    function App() {
      const [me, setMe]           = useState(null);
      const [chores, setChores]   = useState(null);     // null until first load
      const [storage, setStorage] = useState(null);     // { backend, pending, can_manage }
      const [waiting, setWaiting] = useState(false);    // graduated placement, binding missing
      const [draft, setDraft]     = useState({ chore: "", assignee: "", cadence: "weekly" });

      async function refresh() {
        const r = await frame.api("api/list").catch(() => null);
        if (!r) return;
        if (r.storage) setStorage(r.storage);
        setWaiting(!!r.waiting_for_binding);
        if (r.chores) setChores(r.chores);
      }
      // Writes go over the tether (frame.busSend) — fire-and-forget; the board refreshes
      // from the chores_changed push, sender included. Feature-detect: an older viewer's
      // framelib has no busSend, so fall back to the HTTP write it was using before.
      const write = (path, body) => {
        if (typeof frame.busSend === "function") {
          frame.busSend({ op: path.replace(/^api\//, ""), ...(body || {}) });
          return Promise.resolve({});
        }
        return frame.api(path, body);
      };
      useEffect(() => {
        frame.api("api/whoami").then((m) => {
          if (m && m.space_color) applyChannel(document.documentElement, m.space_color);
          setMe(m);
        }).catch(() => setMe({}));
        refresh();
      }, []);
      useFramePush({ chores_changed: refresh });

      if (!me || chores === null && !waiting) return html`<div></div>`;
      const isEditor = !!me.is_sfi_editor;
      const all = chores || [];

      // ---- mutations -------------------------------------------------------------------
      function addChore() {
        const chore = draft.chore.trim();
        if (!chore) return;
        write("api/chore", { chore, assignee: draft.assignee.trim(), cadence: draft.cadence }).catch(() => {});
        // keep who and rhythm: adding a run of chores for one person is the common case
        setDraft({ chore: "", assignee: draft.assignee, cadence: draft.cadence });
      }
      // Optimistic: flip locally, reconcile from the push — ticking a chore off must feel
      // instant, and it is the one thing a kid at the fridge tablet actually does.
      function tick(c) {
        if (!isEditor) return;
        const done = !c.done;
        setChores((xs) => xs && xs.map((x) => x.id === c.id ? { ...x, done } : x));
        write("api/chore/" + c.id + (done ? "/done" : "/undo"), {}).catch(() => {});
      }

      // One menu per chore rather than a rail of icons on every row: the big tick stays
      // the only thing you can hit by accident, which is what makes the board kid-safe.
      // `jumpTo` lets the card's own affordances (the person chip, the rhythm) open the
      // one thing they name instead of making you walk the whole menu to get there.
      async function editChore(c, jumpTo) {
        if (!isEditor) return;
        const what = jumpTo || (frame.choose
          ? await frame.choose(c.chore, {
              title: "Chore",
              options: [
                { id: "rename", label: "Rename", icon: "ph-pencil-simple" },
                { id: "who", label: "Who does it", icon: "ph-user", detail: c.assignee || "Nobody in particular" },
                { id: "cadence", label: "How often", icon: "ph-repeat", detail: c.cadence },
                { id: "remove", label: "Remove", icon: "ph-trash-simple" },
              ],
            })
          : "rename");
        if (what === "rename") {
          const name = await frame.prompt("Chore", { title: "Rename", value: c.chore, okLabel: "Save" });
          if (name && name.trim() && name.trim() !== c.chore) write("api/chore/" + c.id, { chore: name.trim() }).catch(() => {});
        } else if (what === "who") {
          const who = await frame.prompt("Leave it empty for anyone.", { title: "Who does it", value: c.assignee, okLabel: "Save" });
          if (who !== null) write("api/chore/" + c.id, { assignee: who.trim() }).catch(() => {});
        } else if (what === "cadence") {
          const pick = await frame.choose("How often does this come back?", {
            title: "Rhythm",
            options: CADENCES.map((k) => ({ id: k, label: k, icon: k === "once" ? "ph-check" : "ph-repeat" })),
          });
          if (pick) write("api/chore/" + c.id, { cadence: pick }).catch(() => {});
        } else if (what === "remove") {
          const sure = await frame.confirm(`Remove "${c.chore}" from the chart?`, { title: "Chore", okLabel: "Remove" });
          if (sure) {
            setChores((xs) => xs && xs.filter((x) => x.id !== c.id));
            write("api/chore/" + c.id + "/delete", {}).catch(() => {});
          }
        }
      }

      // ---- the data drawer (owner-only) --------------------------------------------------
      // One button, one surface: the frame says nothing about storage at rest, and every
      // data action lives here. Single call site so #755 (frame-chrome data controls) can
      // replace this wholesale. See docs/table-graduation.md.
      async function onDrawer() {
        if (storage.pending) {
          const stop = await frame.confirm("Stop the move to a shared table?", {
            title: "Chart data", okLabel: "Stop", cancelLabel: "Keep going",
          });
          if (stop) { await write("api/data/cancel_graduate", {}).catch(() => null); refresh(); }
          return;
        }
        if (storage.backend === "shared") {
          const names = (storage.table_titles || []).map((t) => `"${t}"`).join(" and ");
          const where = names ? `${names}, a shared table` : "a shared table";
          const picked = frame.choose
            ? await frame.choose(`These chores live in ${where}, so other frames in this space can work with the same rows.`, {
                title: "Chart data",
                options: [
                  { id: "adopt", label: "Use a different shared table", icon: "ph-plugs-connected",
                    detail: "Point this at another table you already have" },
                ],
              })
            : null;
          if (picked === "adopt") { await write("api/data/graduate", { mode: "adopt" }).catch(() => null); refresh(); }
          return;
        }
        const mode = frame.choose
          ? await frame.choose("These chores live on this device.", {
              title: "Chart data",
              options: [
                { id: "convert", label: "Move to a shared table", icon: "ph-dresser",
                  detail: "Copies this chart so other frames can use it" },
                { id: "adopt", label: "Use an existing shared table", icon: "ph-plugs-connected",
                  detail: "Point this chart at a table you already have" },
              ],
            })
          : ((await frame.confirm("Move this chart's data to a shared table?", { title: "Chart data", okLabel: "Move" })) ? "convert" : null);
        if (mode) { await write("api/data/graduate", { mode }).catch(() => null); refresh(); }
      }

      // ---- order: still-open cards first, then by person, then by when they were added.
      // Cards stay one flat board — the person is colour on the card, not a box around it.
      const cards = [...all].sort((a, b) =>
        (a.done ? 1 : 0) - (b.done ? 1 : 0)
        || (a.assignee || "￿").localeCompare(b.assignee || "￿")
        || a.sort_order - b.sort_order);
      const knownPeople = [...new Set(all.map((c) => c.assignee).filter(Boolean))].sort();

      const doneCount = all.filter((c) => c.done).length;
      const mode = me.is_owner ? "owner" : isEditor ? "editor" : "viewer";

      return html`
        <main class=${isEditor ? "" : "read-only"}>
          <div class="header">
            <i class="ph-light ph-broom"></i>
            <h1>Chore Chart</h1>
            <span class="mode">${mode}</span>
            ${storage && storage.can_manage ? html`
              <button class=${"drawer" + (storage.pending ? " pending" : "")}
                title=${storage.pending ? "Finishing a move to a shared table" : "Chart data"}
                onClick=${onDrawer}>
                <i class="ph-light ph-dresser"></i>
              </button>` : null}
          </div>

          ${waiting ? html`
            <div class="notice">
              <i class="ph-light ph-table"></i>
              <p>${me.is_owner
                ? "This chart is moving to a shared table. Pick or create the table to finish."
                : "This chart is being set up. It will be back in a moment."}</p>
            </div>`
          : html`
            ${!isEditor ? html`
              <div class="banner">
                <i class="ph-light ph-eye"></i>
                <span>${me.is_anon ? "You are watching this chart." : "You can see this chart but not change it."}</span>
              </div>` : null}

            ${all.length > 0 ? html`
              <div class="progress">
                <span>${doneCount} of ${all.length} done</span>
                <div class="meter"><div style=${"width:" + Math.round(doneCount / all.length * 100) + "%"}></div></div>
              </div>` : null}

            ${isEditor ? html`
              <div class="add">
                <i class="ph-light ph-plus"></i>
                <input class="f-chore" maxlength="200" placeholder="Add a chore…" value=${draft.chore}
                  onInput=${(e) => setDraft({ ...draft, chore: e.target.value })}
                  onKeyDown=${(e) => { if (e.key === "Enter") addChore(); }} />
                <input class="f-who" maxlength="60" placeholder="Who" list="chore-people" value=${draft.assignee}
                  onInput=${(e) => setDraft({ ...draft, assignee: e.target.value })}
                  onKeyDown=${(e) => { if (e.key === "Enter") addChore(); }} />
                <button class="cadbtn" title="How often it comes back"
                  onClick=${() => setDraft({ ...draft, cadence: CADENCES[(CADENCES.indexOf(draft.cadence) + 1) % CADENCES.length] })}>
                  ${draft.cadence}
                </button>
                <datalist id="chore-people">
                  ${knownPeople.map((n) => html`<option key=${n} value=${n}></option>`)}
                </datalist>
              </div>` : null}

            ${all.length === 0
              ? html`<div class="empty">${isEditor ? "No chores yet. Add the first one above." : "Nothing here yet."}</div>`
              : html`
                <div class="cards">
                  ${cards.map((c) => {
                    const slots = SLOTS[c.cadence] ?? 6;
                    // The live slot is THIS turn and the only pressable one; everything to
                    // its left is the run so far. When the turn is already handled the live
                    // slot IS the newest punch (so a run of 1 shows ONE mark, not two);
                    // when it isn't, the live slot sits just past the run. A run longer than
                    // the card says so in the tally rather than growing endless holes.
                    // max(0, …): a row written by another frame on the shared table could
                    // carry a done timestamp with a zero run, and without the clamp that
                    // card would render no live slot at all — nothing to press to undo it.
                    const live = Math.max(0, c.done
                      ? Math.min(c.streak, slots) - 1
                      : Math.min(c.streak, slots - 1));
                    return html`
                      <div class=${"card" + (c.done ? " done" : "")} key=${c.id}
                        style=${c.assignee ? "--ch: " + channelFor(c.assignee) : ""}>
                        <div class="c-top">
                          <button class="who" disabled=${!isEditor} title="Who does it"
                            onClick=${() => editChore(c, "who")}>
                            <span class="badge">${c.assignee ? initial(c.assignee) : html`<i class="ph-light ph-users"></i>`}</span>
                            <span class="who-name">${c.assignee || "anyone"}</span>
                          </button>
                          <button class="rhythm" disabled=${!isEditor} title="How often it comes back"
                            onClick=${() => editChore(c, "cadence")}>${c.cadence}</button>
                        </div>

                        <button class="c-name" disabled=${!isEditor} onClick=${() => editChore(c)}>${c.chore}</button>

                        <div class="punches">
                          ${Array.from({ length: slots }, (_, i) => {
                            const isLive = i === live;
                            const punched = i < live || (isLive && c.done);
                            return html`<button key=${i} type="button"
                              class=${"slot" + (punched ? " punched" : "") + (isLive ? " live" : "")}
                              disabled=${!isEditor || !isLive}
                              title=${isLive ? (c.done ? "Done this turn — press to undo" : "Punch it") : ""}
                              onClick=${isLive ? () => tick(c) : null}></button>`;
                          })}
                          ${c.streak > slots || c.best_streak > c.streak ? html`
                            <span class="tally" title=${"run of " + c.streak + ", best " + c.best_streak}>
                              ${c.streak > slots ? html`<b>${c.streak}</b>` : null}
                              ${c.best_streak > c.streak ? "best " + c.best_streak : null}
                            </span>` : null}
                        </div>
                      </div>`;
                  })}
                </div>`}
          `}
        </main>`;
    }

    render(html`<${App} />`, document.getElementById("app"));
  </script>
</body>
</html>
