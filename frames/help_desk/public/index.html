<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Desk</title>
  <link rel="stylesheet" href="/dyn/frame-prefs.css">
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <main id="app" class="hd-root"></main>
  <script type="module">
import { frame, html, render, useState, useEffect, useRef, Fragment, useFramePush, applyChannel } from "/lib/js/framelib.js";

// Everything this page knows comes from its own server half (./api/…): a visitor reads no
// table, and a member's acts are checked there, so this is one page wherever it was opened.
async function api(method, path, body) {
  const r = await window.seamside.fetch(`/api${path}`, { method, ...(body ? { body: JSON.stringify(body) } : {}) });
  let v = {};
  try { v = r.json(); } catch { /* the status says it */ }
  if (!r.ok) throw new Error(v.error || "Something went wrong. Try again.");
  return v;
}

// Who the door says this is, read once from the worker with the form it opens on.
let opened = { fields: [], title: "", you: {} };
let me = { is_anon: true, can_edit: false };

// A page has no form submit: a button's click asks each control whether it is filled in.
const filled = (e) => [...e.target.closest("[data-form]").querySelectorAll("input, select, textarea")]
  .every((el) => el.reportValidity());
const onEnter = (act) => (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); act(e); } };

function formatRelative(ts) {
  const diff = Math.max(0, Date.now() - ts);
  const s = Math.floor(diff / 1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}

// =====================================================================================
// Anonymous submit form
// =====================================================================================
function AnonForm() {
  const fields = opened.fields || [];
  const deskTitle = (opened.title || "").trim();
  const [values, setValues] = useState({});
  const [email, setEmail] = useState("");
  const [err, setErr] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [sentTo, setSentTo] = useState(null);

  const onChange = (fid, v) => setValues((prev) => ({ ...prev, [fid]: v }));

  const submit = async (e) => {
    if (submitting || !filled(e)) return;
    setErr("");
    setSubmitting(true);
    try {
      await api("POST", "/submit", { email: email.trim(), fields: values });
      setSentTo(email.trim());
    } catch (e2) {
      setErr(e2.message || String(e2));
    } finally {
      setSubmitting(false);
    }
  };

  const reset = () => {
    setSentTo(null);
    setEmail("");
    setValues({});
    setErr("");
  };

  if (sentTo) {
    return html`<section class="hd-anon">
      <div class="hd-success">
        <i class="ph-light ph-check-circle icon-md"></i>
        <div>
          <div style="font-weight: var(--os-weight-semibold);">Message sent</div>
          <div class="muted" style="font-size: var(--os-fs-sm);">We'll reach out at ${sentTo}.</div>
        </div>
      </div>
      <div class="row" style="justify-content: center; margin-top: var(--os-sp-xl);">
        <button class="ghost" onClick=${reset}><i class="ph-light ph-arrow-left icon-sm"></i> Send another</button>
      </div>
    </section>`;
  }

  return html`<section class="hd-anon">
    <h1 class="hd-public-title">${deskTitle || "Send us a message"}</h1>
    <p class="hd-subtitle muted">We'll get back to you at the email you provide.</p>
    <div class="stack" data-form>
      ${err && html`<div class="hd-error">${err}</div>`}
      <div class="hd-field">
        <label for="hd-email">Email <span class="req">*</span></label>
        <input id="hd-email" type="email" required autocomplete="email" placeholder="you@example.com"
          value=${email} onInput=${(e) => setEmail(e.target.value)} onKeyDown=${onEnter(submit)} />
      </div>
      ${fields.map((f) => html`<${CustomFieldInput} key=${f.id} field=${f} value=${values[f.id]} onChange=${(v) => onChange(f.id, v)} />`)}
      <div class="row" style="justify-content: flex-end; gap: var(--os-sp-sm);">
        <button disabled=${submitting} onClick=${submit}>
          <i class="ph-light ph-paper-plane-tilt icon-sm"></i> Send
        </button>
      </div>
    </div>
  </section>`;
}

function CustomFieldInput({ field: f, value, onChange }) {
  const req = f.required ? html`<span class="req">*</span>` : null;
  if (f.type === "checkbox") {
    return html`<div class="hd-field inline">
      <input id=${"hd-f-" + f.id} type="checkbox" required=${f.required}
        checked=${!!value} onChange=${(e) => onChange(e.target.checked)} />
      <label for=${"hd-f-" + f.id}>${f.label} ${req}</label>
    </div>`;
  }
  if (f.type === "dropdown") {
    return html`<div class="hd-field">
      <label for=${"hd-f-" + f.id}>${f.label} ${req}</label>
      <select id=${"hd-f-" + f.id} required=${f.required}
        value=${value || ""} onChange=${(e) => onChange(e.target.value)}>
        <option value="">Select…</option>
        ${(f.options || []).map((o) => html`<option key=${o} value=${o}>${o}</option>`)}
      </select>
    </div>`;
  }
  if (f.type === "textarea") {
    return html`<div class="hd-field">
      <label for=${"hd-f-" + f.id}>${f.label} ${req}</label>
      <textarea id=${"hd-f-" + f.id} rows="5" required=${f.required}
        value=${value || ""} onInput=${(e) => onChange(e.target.value)}></textarea>
    </div>`;
  }
  return html`<div class="hd-field">
    <label for=${"hd-f-" + f.id}>${f.label} ${req}</label>
    <input id=${"hd-f-" + f.id} type="text" required=${f.required}
      value=${value || ""} onInput=${(e) => onChange(e.target.value)} />
  </div>`;
}

// =====================================================================================
// Admin view
// =====================================================================================
function previewFor(s, fieldMap) {
  const pick = (pred) => {
    for (const [fid, v] of Object.entries(s.fields || {})) {
      if (typeof v !== "string" || !v.trim()) continue;
      const f = fieldMap.get(String(fid));
      if (pred(f)) return v.trim();
    }
    return "";
  };
  return pick((f) => f && f.type === "textarea")
    || pick((f) => f && f.type === "text")
    || pick(() => true);
}

function Submission({ s, fields, isOpen, isHighlight, notes, onToggle, onSetStatus, onDelete, onAddNote }) {
  const fieldMap = new Map(fields.map((f) => [String(f.id), f]));
  const blocks = [];
  const compact = [];
  for (const [fid, v] of Object.entries(s.fields || {})) {
    if (v === "" || v === undefined || v === null || v === false) continue;
    const f = fieldMap.get(String(fid));
    const label = f ? f.label : `#${fid}`;
    if (f && f.type === "textarea") {
      blocks.push(html`<div key=${fid}>
        <div class="muted" style="font-size: var(--os-fs-xs); margin-bottom: 2px;">${label}</div>
        <div class="hd-sub-message">${String(v)}</div>
      </div>`);
    } else {
      const val = v === true ? "yes" : String(v);
      compact.push({ fid, label, val });
    }
  }
  const previewRaw = previewFor(s, fieldMap);
  const preview = previewRaw
    ? (previewRaw.length > 140 ? previewRaw.slice(0, 140) + "…" : previewRaw)
    : "(no content)";

  return html`<article class=${`hd-sub status-${s.status} ${isOpen ? "open" : ""} ${isHighlight ? "highlight" : ""}`} data-sub-id=${s.id}>
    <div class="hd-sub-head" onClick=${onToggle}>
      <span class="hd-status-pill">${s.status.replace("_", " ")}</span>
      <span class="hd-sub-email">${s.email}</span>
      <span class="hd-sub-time" title=${new Date(s.submitted_at).toISOString()}>${formatRelative(s.submitted_at)}</span>
    </div>
    <div class="hd-sub-preview" onClick=${onToggle}>${preview}</div>
    ${isOpen && html`<div class="hd-sub-detail" onClick=${(e) => e.stopPropagation()}>
      ${blocks.length === 0 && compact.length === 0
        ? html`<div class="muted" style="font-size: var(--os-fs-sm);">(no additional fields submitted)</div>`
        : html`<${Fragment}>
            ${blocks}
            ${compact.length > 0 && html`<dl class="hd-sub-meta">
              ${compact.flatMap((c) => [html`<dt key=${"dt-" + c.fid}>${c.label}</dt>`, html`<dd key=${"dd-" + c.fid}>${c.val}</dd>`])}
            </dl>`}
          </${Fragment}>`}
      <div class="hd-sub-actions">
        <label style="font-size: var(--os-fs-sm); color: var(--os-text-muted);">Status</label>
        ${me.can_edit ? html`<select value=${s.status} onChange=${(e) => onSetStatus(s.id, e.target.value)}>
          ${["new", "in_progress", "resolved", "archived"].map((st) => html`<option key=${st} value=${st}>${st.replace("_", " ")}</option>`)}
        </select>` : html`<span class="hd-status-pill">${s.status.replace("_", " ")}</span>`}
        <a class="hd-mail-btn" href=${`mailto:${encodeURIComponent(s.email)}?subject=${encodeURIComponent("Re: your message")}`}>
          <i class="ph-light ph-envelope-simple icon-sm"></i> Reply via email
        </a>
        <span class="spacer" style="flex:1;"></span>
        ${me.can_edit && html`<button class="ghost" onClick=${() => onDelete(s.id)}><i class="ph-light ph-trash icon-sm"></i></button>`}
      </div>
      <div>
        <div class="muted" style="font-size: var(--os-fs-xs); margin-bottom: var(--os-sp-xs);">Internal notes</div>
        <${NotesPanel} submissionId=${s.id} notes=${notes} />
        ${me.can_edit && html`<${AddNoteForm} onSubmit=${(body) => onAddNote(s.id, body)} />`}
      </div>
    </div>`}
  </article>`;
}

function NotesPanel({ submissionId, notes }) {
  if (notes === undefined) return html`<div class="hd-notes" id=${"hd-notes-" + submissionId}>
    <div class="muted" style="font-size: var(--os-fs-xs);">loading…</div>
  </div>`;
  if (notes.length === 0) return html`<div class="hd-notes" id=${"hd-notes-" + submissionId}>
    <div class="muted" style="font-size: var(--os-fs-xs);">No notes yet.</div>
  </div>`;
  return html`<div class="hd-notes" id=${"hd-notes-" + submissionId}>
    ${notes.map((n) => html`<div class="hd-note" key=${n.id}>
      <div class="hd-note-head">
        <span>${n.author_name || "admin"}</span>
        <span>${formatRelative(n.created_at)}</span>
      </div>
      <div class="hd-note-body">${n.body}</div>
    </div>`)}
  </div>`;
}

function AddNoteForm({ onSubmit }) {
  const [val, setVal] = useState("");
  const submit = () => {
    const body = val.trim();
    if (!body) return;
    onSubmit(body);
    setVal("");
  };
  return html`<div class="hd-note-form" style="margin-top: var(--os-sp-sm);">
    <textarea rows="2" placeholder="Add a private note for your team…"
      value=${val} onInput=${(e) => setVal(e.target.value)}></textarea>
    <div class="row" style="justify-content: flex-end;">
      <button class="ghost" onClick=${submit}><i class="ph-light ph-plus icon-sm"></i> Add note</button>
    </div>
  </div>`;
}

function InboxView({ submissions, fields, openId, highlightId, notesBySub, setOpenId, onToggleNotes, ...handlers }) {
  if (submissions.length === 0) {
    return html`<div class="hd-inbox-empty">
      <i class="ph-light ph-tray icon-lg"></i>
      <p>No messages yet. When visitors submit the form, they'll show up here in realtime.</p>
    </div>`;
  }
  const nNew = submissions.filter((s) => s.status === "new").length;
  const nProg = submissions.filter((s) => s.status === "in_progress").length;
  const nDone = submissions.filter((s) => s.status === "resolved").length;
  return html`<div class="hd-inbox">
    <div class="hd-airhero">${nNew} new · ${nProg} in progress · ${nDone} resolved</div>
    ${submissions.map((s) => html`<${Submission} key=${s.id} s=${s} fields=${fields}
      isOpen=${openId === s.id}
      isHighlight=${highlightId === s.id}
      notes=${notesBySub.get(s.id)}
      onToggle=${() => {
        const next = openId === s.id ? null : s.id;
        setOpenId(next);
        if (next === s.id) onToggleNotes(s.id);
      }}
      ...${handlers}
    />`)}
  </div>`;
}

function FieldsView({ fields, onCreate, onSetRequired, onDelete, toast }) {
  const [label, setLabel] = useState("");
  const [type, setType] = useState("text");
  const [required, setRequired] = useState(false);
  const [optsRaw, setOptsRaw] = useState("");

  const submit = async (e) => {
    if (!filled(e)) return;
    const opts = type === "dropdown" ? optsRaw.split(",").map((s) => s.trim()).filter(Boolean) : [];
    if (type === "dropdown" && opts.length === 0) { toast("dropdown needs at least one option"); return; }
    await onCreate({ label: label.trim(), type, required, options: opts });
    setLabel(""); setRequired(false); setOptsRaw(""); setType("text");
  };

  return html`<div class="hd-fields">
    <div>
      <h2>Form Fields</h2>
      <p class="muted">Visitors always fill in <strong>Email</strong>. The <em>Message</em> field below is included by default — remove it if another field fits better, or keep and mark required.</p>
    </div>
    <div class="hd-field-row fixed">
      <span class="label">Email</span>
      <span class="type">text</span>
      <span class="spacer"></span>
      <span class="required-toggle">required • default</span>
    </div>
    ${fields.map((f) => html`<div class="hd-field-row" key=${f.id} data-fid=${f.id}>
      <span class="label">${f.label}</span>
      <span class="type">${f.type}</span>
      ${f.type === "dropdown" && html`<span class="options">options: ${(f.options || []).join(", ")}</span>`}
      <span class="spacer"></span>
      <label class="required-toggle">
        <input type="checkbox" checked=${f.required} disabled=${!me.can_edit} onChange=${(e) => onSetRequired(f.id, e.target.checked)} /> required
      </label>
      ${me.can_edit && html`<button class="ghost" title="Remove field" onClick=${() => onDelete(f.id)}><i class="ph-light ph-trash icon-sm"></i></button>`}
    </div>`)}
    ${me.can_edit && html`<div class="hd-add-form" data-form>
      <div class="row">
        <input class="grow" type="text" placeholder="Field label (e.g. Phone number)" required
          value=${label} onInput=${(e) => setLabel(e.target.value)} onKeyDown=${onEnter(submit)} />
        <select value=${type} onChange=${(e) => setType(e.target.value)}>
          <option value="text">Text</option>
          <option value="textarea">Textarea</option>
          <option value="checkbox">Checkbox</option>
          <option value="dropdown">Dropdown</option>
        </select>
        <label class="checkbox-lbl">
          <input type="checkbox" checked=${required} onChange=${(e) => setRequired(e.target.checked)} /> required
        </label>
      </div>
      ${type === "dropdown" && html`<div class="row">
        <input class="grow" type="text" placeholder="Option 1, Option 2, Option 3"
          value=${optsRaw} onInput=${(e) => setOptsRaw(e.target.value)} />
      </div>`}
      <div class="row" style="justify-content: flex-end;">
        <button onClick=${submit}><i class="ph-light ph-plus icon-sm"></i> Add field</button>
      </div>
    </div>`}
  </div>`;
}

function AdminView() {
  const [tab, setTab] = useState("inbox");
  const [submissions, setSubmissions] = useState([]);
  const [fields, setFields] = useState(opened.fields || []);
  const [openId, setOpenId] = useState(null);
  const [highlightId, setHighlightId] = useState(null);
  const [notesBySub, setNotesBySub] = useState(new Map());
  const [toastMsg, setToastMsg] = useState(null);
  const [deskTitle, setDeskTitle] = useState(opened.title || "");

  // What the push handler and the loaders read without a stale closure.
  const stateRef = useRef({ openId: null, known: null, notes: notesBySub });
  stateRef.current.openId = openId;
  stateRef.current.notes = notesBySub;

  const toast = (m) => setToastMsg(m);
  const failed = (what) => (e) => toast(e.message || what);

  // The inbox as it stands. A message this page had not seen is the one that arrived.
  const loadSubmissions = async () => {
    const list = (await api("GET", "/admin/messages")).submissions || [];
    const known = stateRef.current.known;
    stateRef.current.known = new Set(list.map((s) => s.id));
    setSubmissions(list);
    if (stateRef.current.openId && !stateRef.current.known.has(stateRef.current.openId)) setOpenId(null);
    const fresh = known && list.find((s) => !known.has(s.id));
    if (fresh) {
      setHighlightId(fresh.id);
      setTimeout(() => setHighlightId(null), 1200);
      toast(`New message from ${fresh.email}`);
    }
  };
  const loadForm = () => api("GET", "/config").then((r) => { setFields(r.fields || []); setDeskTitle(r.title || ""); });
  const loadNotes = (subId) => api("GET", `/admin/messages/${subId}/notes`).then(({ notes }) => {
    setNotesBySub((prev) => { const m = new Map(prev); m.set(subId, notes || []); return m; });
  });

  useEffect(() => { loadSubmissions().catch(failed("load failed")); }, []);

  // Placement display name — saves on blur/Enter (mirrors roadmap's proj-name).
  const saveTitle = (v) => {
    const t = v.trim();
    if (t === deskTitle) return;
    setDeskTitle(t);
    api("PUT", "/admin/title", { title: t }).catch(failed("rename failed"));
  };

  // The worker says what changed and never what it holds: read it again, as whoever this is.
  useFramePush((d) => {
    if (d.help_desk === "messages") loadSubmissions().catch(() => {});
    else if (d.help_desk === "notes") for (const id of stateRef.current.notes.keys()) loadNotes(id).catch(() => {});
    else if (d.help_desk === "form") loadForm().catch(() => {});
  });

  useEffect(() => {
    if (!toastMsg) return;
    const id = setTimeout(() => setToastMsg(null), 2200);
    return () => clearTimeout(id);
  }, [toastMsg]);

  const setStatus = (id, status) =>
    api("PUT", `/admin/messages/${id}/status`, { status }).then(loadSubmissions).catch(failed("update failed"));
  const deleteSubmission = async (id) => {
    if (!(await frame.confirm("Delete this message and all its notes?", { danger: true, okLabel: "Delete" }))) return;
    await api("DELETE", `/admin/messages/${id}`).then(loadSubmissions).catch(failed("delete failed"));
  };
  const addNote = (id, body) =>
    api("POST", `/admin/messages/${id}/notes`, { body }).then(({ notes }) => {
      setNotesBySub((prev) => { const m = new Map(prev); m.set(id, notes || []); return m; });
    }).catch(failed("failed"));
  const fetchNotes = (subId) => {
    if (notesBySub.has(subId)) return;
    loadNotes(subId).catch(() => {});
  };

  const createField = (payload) => api("POST", "/admin/fields", payload).then(loadForm).catch(failed("failed"));
  const setFieldRequired = (fid, required) =>
    api("PUT", `/admin/fields/${fid}`, { required }).catch(failed("failed")).then(loadForm);
  const deleteField = async (fid) => {
    if (!(await frame.confirm("Remove this field?", { danger: true, okLabel: "Remove" }))) return;
    await api("DELETE", `/admin/fields/${fid}`).then(loadForm).catch(failed("failed"));
  };

  const newCount = submissions.filter((s) => s.status === "new").length;

  return html`<section class="hd-admin">
    <header class="hd-admin-header">
      <h1>
        <i class="ph-light ph-lifebuoy icon-md"></i>
        <div class="hd-title-edit"><input value=${deskTitle} maxlength="120" placeholder="Send us a message" disabled=${!me.can_edit}
          onBlur=${(e) => saveTitle(e.target.value)}
          onKeyDown=${(e) => { if (e.key === "Enter") e.target.blur(); }} /></div>
      </h1>
      <nav class="hd-tabs">
        <button class=${"hd-tab" + (tab === "inbox" ? " active" : "")} onClick=${() => setTab("inbox")}>
          Inbox ${newCount > 0 && html`<span class="hd-count-badge">${newCount}</span>`}
        </button>
        <button class=${"hd-tab" + (tab === "fields" ? " active" : "")} onClick=${() => setTab("fields")}>
          Form Fields
        </button>
      </nav>
    </header>
    <div class="hd-admin-body">
      ${tab === "inbox"
        ? html`<${InboxView} submissions=${submissions} fields=${fields}
            openId=${openId} highlightId=${highlightId} notesBySub=${notesBySub}
            setOpenId=${setOpenId}
            onToggleNotes=${fetchNotes}
            onSetStatus=${setStatus} onDelete=${deleteSubmission} onAddNote=${addNote} />`
        : html`<${FieldsView} fields=${fields} onCreate=${createField}
            onSetRequired=${setFieldRequired} onDelete=${deleteField} toast=${toast} />`}
    </div>
    ${toastMsg && html`<div class="hd-toast show">${toastMsg}</div>`}
  </section>`;
}

function App() {
  return me.is_anon ? html`<${AnonForm} />` : html`<${AdminView} />`;
}

const app = document.getElementById("app");
try {
  await window.seamside.ready;
  opened = await api("GET", "/config");
  me = { is_anon: !opened.you.member, can_edit: !!opened.you.editor };
  if (opened.color) applyChannel(document.body, opened.color);
  render(html`<${App}/>`, app);
} catch (e) {
  render(html`<div class="hd-error">${e.message || String(e)}</div>`, app);
}
  </script>
</body>
</html>
